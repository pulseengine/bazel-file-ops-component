# cargo-deny configuration (shape from pulseengine/rivet's deny.toml).
# Run by the "Dependency Security Check" job in security.yml:
#   cargo deny check advisories bans licenses sources
# An accepted advisory goes in [advisories].ignore with its reason and a
# re-check date, never as a silent ignore.

[graph]
# Every feature, so optional dependencies are checked too.
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git sources, each pinned by Cargo.lock to one commit:
# - rivet: rivet-yaml from a rivet tag (DD-KS-014, rivet#1099);
# - rowan: pulseengine/rowan fix/miri-soundness-v3, as spar and rivet use it.
allow-git = [
    "https://github.com/pulseengine/rivet",
    "https://github.com/pulseengine/rowan.git",
]
