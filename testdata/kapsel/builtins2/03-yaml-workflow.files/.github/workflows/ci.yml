# CI for the demo crate
name: ci
on:
  push:
    branches: [main]   # only main
jobs:
  test:
    runs-on: ubuntu-24.04  # pinned image
    steps:
      # check out first
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cargo test
      - {run: cargo doc}
    timeout-minutes: 30
