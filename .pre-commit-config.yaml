repos:
  # Rust formatting via local toolchain
  - repo: local
    hooks:
      - id: rustfmt
        name: Rust Format
        description: Format Rust files with rustfmt
        entry: rustfmt
        language: system
        files: '\.rs$'

  # JavaScript/TypeScript/Documentation formatting (optional)
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (optional)
        description: Format JS/TS/MD files if prettier is available
        entry: bash -c 'if command -v prettier >/dev/null 2>&1; then prettier --write "$@"; else echo "Prettier not installed globally, skipping formatting"; fi'
        language: system
        files: '\.(js|ts|jsx|tsx|json|yaml|yml|md|mdx|astro|css)$'
        exclude: '(package-lock\.json|\.lock|node_modules)$'

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: ['--fix']
        files: '\.(md|mdx)$'

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.patch$'
      - id: end-of-file-fixer
        exclude: '\.patch$'
      - id: check-yaml
        exclude: '\.md$'
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  # Conventional commits validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore]

  # Custom local hooks
  - repo: local
    hooks:
      - id: rust-clippy
        name: Rust Clippy
        description: Run clippy on the Cargo workspace
        entry: cargo clippy --locked --workspace --all-targets
        language: system
        files: '\.rs$'
        pass_filenames: false

      # WIT file validation
      - id: wit-validation
        name: WIT File Validation
        description: Validate WIT files are syntactically correct
        entry: bash -c 'for file in "$@"; do echo "Validating $file"; done'
        language: system
        files: '\.wit$'

ci:
  autofix_commit_msg: |
    style: auto fixes from pre-commit hooks

    🤖 Generated with pre-commit

  autoupdate_commit_msg: |
    chore: update pre-commit hooks

    🤖 Generated with pre-commit
