  - id: VER-KS-009
    type: verification
    title: The parser accepts the decided subset and refuses everything else
    status: verified
    release: v0.3.0
    description: "Every accept case parses to its golden tree with exact spans, every one of the 54 refuse cases (if, case, functions, subshells, backquotes, arithmetic, process substitution, here-strings, ...) yields parse errors naming the construct, the tree is lossless on all goldens, dash accepts every accept case, the corpus parses, and a parse error becomes a KS-R000 refusal through the real parser. A refusal never runs: the no-run-without-a-plan tests in crates/kapsel-cli/tests show it."
    fields:
      method: automated-test
      steps: "cmd: cargo test --locked --workspace --no-fail-fast (or: cargo test --locked -p kapsel-syntax --test golden; cargo test --locked -p kapsel-check); ci: rust.yml run 46161929116 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d, job Rust workspace tests, step Test (cargo test --locked --workspace --no-fail-fast with KAPSEL_REQUIRE_STRACE=1): 494 passed, 0 failed, 3 ignored, run success; the same 494 passed in ci.yml run 46161929013 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d (job Integration Testing, step Test workspace), success; every named test ok in both logs, except tests marked --ignored, which are cited separately"
      test-location: crates/kapsel-syntax/tests/golden.rs; crates/kapsel-check/tests/plant_pack.rs; crates/kapsel-check/src/tests.rs
      test-name: accept_goldens, accept_spans_exact_and_nested, refuse_goldens, lossless_on_all_goldens, dash_accepts_accept_cases, corpus_parses, incomplete_inputs; plant_pack_through_the_real_parser (KS-R000); tests::parse_errors_become_r000_one_each
    links:
      - type: verifies
        target: REQ-KS-010
      - type: verifies
        target: DD-KS-002

  - id: VER-KS-010
    type: verification
    title: kapsel check runs nothing (one input)
    status: verified
    release: v0.3.0
    description: "kapsel check --json on 'cat a | sort -u > b' prints the plan and b is not created; a refused input exits 65. Over every plant-pack script, parse golden input and error-corpus case, check with -c, with a script file and with --json, in an empty scratch directory, creates, changes and removes nothing (before and after snapshot of names, kinds, sizes, mtimes and contents; KAPSEL_HOME is untouched too) and starts no child process. Process instrument: a PATH holding a tripwire executable for every built-in and common tool name (each logs and exits 99), and an empty PATH, with the same stdout, stderr and status required; both also run with HOME and KAPSEL_HOME unset. Blind to: a program started by absolute path, a spawn from code that sets its own PATH, and any network access. On Linux an OS-level count under strace (execve beyond kapsel itself, fork, clone without CLONE_THREAD, AF_INET sockets) also runs. With KAPSEL_REQUIRE_STRACE=1, set in rust.yml's Test step, a missing or non-tracing strace or a non-Linux host fails the test instead of skipping it (1d5d12c), and a test reads rust.yml to check the variable is set; it ran and passed in rust.yml run 46161929116 on 3eac58b. Network access is checked only by that Linux strace run."
    fields:
      method: automated-test
      steps: "cmd: cargo test --locked --workspace --no-fail-fast (or: cargo test --locked -p kapsel-cli --test acceptance --test check_runs_nothing); ci: rust.yml run 46161929116 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d, job Rust workspace tests, step Test (cargo test --locked --workspace --no-fail-fast with KAPSEL_REQUIRE_STRACE=1): 494 passed, 0 failed, 3 ignored, run success; the same 494 passed in ci.yml run 46161929013 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d (job Integration Testing, step Test workspace), success; every named test ok in both logs, except tests marked --ignored, which are cited separately; the strace test is evidence only from rust.yml run 46161929116, where strace is installed and KAPSEL_REQUIRE_STRACE=1 makes a skip a failure"
      test-location: crates/kapsel-cli/tests/acceptance.rs; crates/kapsel-cli/tests/check_runs_nothing.rs
      test-name: check_json_reports_the_plan_grants, check_json_of_a_refusal_exits_65, check_creates_changes_and_removes_nothing_and_spawns_nothing, the_tripwire_catches_a_spawn, check_under_strace_starts_no_process_and_opens_no_socket (Linux, required in CI by KAPSEL_REQUIRE_STRACE=1), strace_requirement_is_read_from_the_environment, syscall_of_strips_both_pid_prefixes
    links:
      - type: verifies
        target: REQ-KS-011

      - type: verifies
        target: FEAT-KS-010
  - id: VER-KS-011
    type: verification
    title: "|| true and || : are refused with a rule id and a reason"
    status: verified
    release: v0.3.0
    description: "Every placement of '|| true' and '|| :' (top level, after &&, inside $(...), in loops) is refused as KS-R001, and so is every || right-hand side whose status is always 0: a pipeline with true or : as any stage (the review's bypass 'false || true | cat', closed in 8271a59), ! of a command that always fails, exit 0 and statuses that are 0 modulo 256, constant-true tests, and loops that end in true or exit; right-hand sides that can fail are left alone. The span covers operator and command; every finding of every rule's planted case has a rule id, a help line and a note; the CLI exits 65 with error[KS-R001] at -c:1:7; the rendered KS-R001 diagnostic is a blessed golden."
    fields:
      method: automated-test
      steps: "cmd: cargo test --locked --workspace --no-fail-fast (or: cargo test --locked -p kapsel-check; cargo test --locked -p kapsel-cli --test acceptance); ci: rust.yml run 46161929116 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d, job Rust workspace tests, step Test (cargo test --locked --workspace --no-fail-fast with KAPSEL_REQUIRE_STRACE=1): 494 passed, 0 failed, 3 ignored, run success; the same 494 passed in ci.yml run 46161929013 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d (job Integration Testing, step Test workspace), success; every named test ok in both logs, except tests marked --ignored, which are cited separately"
      test-location: crates/kapsel-check/src/tests.rs; crates/kapsel-check/src/tests/quality.rs; crates/kapsel-check/tests/plant_pack.rs; crates/kapsel-cli/tests/acceptance.rs; crates/kapsel-diag/tests/golden.rs
      test-name: tests::or_true_always_refuses_everywhere, tests::r001_refuses_every_rhs_that_cannot_fail, tests::r001_leaves_rhs_that_can_fail_alone, tests::r001_span_covers_operator_and_command, tests::quality::every_finding_has_help_and_a_note, plant_pack_through_the_real_parser (KS-R001), or_true_is_refused_with_ks_r001, r001 (kapsel-diag golden)
    links:
      - type: verifies
        target: REQ-KS-012

      - type: verifies
        target: FEAT-KS-010
  - id: VER-KS-012
    type: verification
    title: Every rule has a planted script and a control, and CI fails if either flips
    status: verified
    release: v0.3.0
    description: testdata/kapsel/rules/KS-R000..KS-R018 each hold planted.sh, control.sh and expected.json; the plant pack test runs them through the real parser and fails when a planted case is not caught, its golden changes or its control warns or is refused. The KS-S001..S005 rules have planted and control cases in kapsel-analysis. One registry holds the ids (kapsel_check::RULES for KS-R, kapsel_analysis::RULES for KS-S) and the plant pack, the case tables and the explain-table test iterate it; a test fails if a registered rule lacks planted.sh or control.sh (or, for KS-S, a planted and a control unit test), if a plant-pack directory is not in the registry, if kapsel_diag::RULE_IDS differs from the registry, or if any shipped source names a KS-R or KS-S id literal that is not registered.
    fields:
      method: automated-test
      steps: "cmd: cargo test --locked --workspace --no-fail-fast (or: cargo test --locked -p kapsel-check -p kapsel-analysis -p kapsel-diag); ci: rust.yml run 46161929116 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d, job Rust workspace tests, step Test (cargo test --locked --workspace --no-fail-fast with KAPSEL_REQUIRE_STRACE=1): 494 passed, 0 failed, 3 ignored, run success; the same 494 passed in ci.yml run 46161929013 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d (job Integration Testing, step Test workspace), success; every named test ok in both logs, except tests marked --ignored, which are cited separately"
      test-location: crates/kapsel-check/tests/plant_pack.rs; crates/kapsel-check/src/tests.rs; crates/kapsel-analysis/src/tests.rs; crates/kapsel-check/tests/rule_registry.rs; crates/kapsel-diag/tests/registry.rs
      test-name: plant_pack_through_the_real_parser, tests::plant_pack_files_agree_with_rules, tests::every_rule_catches_its_planted_case_and_passes_its_control, tests::every_rule_id_has_a_case, tests::s001_planted_*/s001_control_*, s002_*, s003_planted/s003_control, s004_planted/s004_control, s005_planted/s005_control, every_registered_rule_has_a_planted_script_and_a_control, plant_pack_directories_are_exactly_the_registry, tests::every_registered_rule_has_a_planted_and_a_control_test, registry_has_no_duplicates_and_the_explain_table_matches_it, every_rule_id_in_the_source_is_in_the_registry
    links:
      - type: verifies
        target: REQ-KS-016
      - type: verifies
        target: DD-KS-004

  - id: VER-KS-013
    type: verification
    title: "-c, script files and the exit codes through the kapsel binary"
    status: verified
    release: v0.3.0
    description: "The real binary runs a script file, returns the last command's status, and exits 64 (usage), 65 (refused), 70 (internal) and 78 (grants) in the cases named. The same content given once with -c and once as a script file, for acceptance commands, statuses, refused inputs, parse errors, warnings and corpus scripts, under run, check and check --json, gives the same stdout, stderr (source name normalised, -c against the path) and exit status, and the same files in the scratch directory; the six failure kinds (64, 65, 70, 78, built-in 2, command 1) have distinct codes and docs/first-shell.md documents them. A script's own literal exit 64, 65, 70 or 78 (or a status equal to one of them modulo 256) warns KS-R018 with a help line, so it does not pass silently as one of kapsel's own failure kinds (8271a59). Not caught: exit with a variable (exit $X); KS-R018 is a warning, so such a script still runs."
    fields:
      method: automated-test
      steps: "cmd: cargo test --locked --workspace --no-fail-fast (or: cargo test --locked -p kapsel-cli --test acceptance --test forms_agree; cargo test --locked -p kapsel-check); ci: rust.yml run 46161929116 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d, job Rust workspace tests, step Test (cargo test --locked --workspace --no-fail-fast with KAPSEL_REQUIRE_STRACE=1): 494 passed, 0 failed, 3 ignored, run success; the same 494 passed in ci.yml run 46161929013 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d (job Integration Testing, step Test workspace), success; every named test ok in both logs, except tests marked --ignored, which are cited separately"
      test-location: crates/kapsel-cli/tests/acceptance.rs; crates/kapsel-cli/tests/forms_agree.rs; crates/kapsel-check/src/tests.rs; crates/kapsel-check/tests/plant_pack.rs
      test-name: script_file, script_status_is_the_last_command, usage_errors_exit_64, or_true_is_refused_with_ks_r001, a_missing_key_file_is_an_internal_error, invalid_grants_exit_78, no_home_fails_closed_with_78_and_writes_nothing, dash_c_and_a_script_file_give_the_same_stdout_stderr_and_status, diagnostics_name_the_source_by_its_form, failure_kinds_have_distinct_exit_codes_and_the_documented_values, tests::r018_warns_on_exit_codes_kapsel_uses, plant_pack_through_the_real_parser (KS-R018)
    links:
      - type: verifies
        target: REQ-KS-014

      - type: verifies
        target: FEAT-KS-020
