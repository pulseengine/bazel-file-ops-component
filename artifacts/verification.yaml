  - id: VER-KS-006
    type: verification
    title: "The WASI component refuses escapes under wasmtime"
    status: verified
    release: v0.2.2
    fields:
      method: demonstration
      steps:
        - "bazel build //tinygo:file_ops_component"
        - "wasmtime run --dir <tmp>::/w with configs that move through link/.. and copy into a symlinked subdirectory"
        - "Both runs fail with a refusal and nothing outside the workspace changes"
    links:
      - type: verifies
        target: FEAT-KS-001

  - id: VER-KS-007
    type: verification
    title: "The Rust component matches the TinyGo v0.2.2 artifact on the equivalence corpus"
    status: approved
    release: v0.3.0
    description: >
      Every case in testdata/kapsel/fileops runs under wasmtime with the sha256-pinned v0.2.2
      file_ops_component.wasm and with the Rust build; files, stdout, stderr and exit codes must
      agree, or the case allowlists the difference with its reason.
    fields:
      method: automated-test
      test-location: crates/kapsel-fileops/tests/equivalence.rs
      test-name: "rust_component_matches_tinygo_oracle (--ignored), run by the required Component Build & Test jobs, by Integration Testing on the AOT-embedded build and by release.yml on both assets before publishing"
    links:
      - type: verifies
        target: REQ-KS-041

  - id: VER-KS-008
    type: verification
    title: "No Go or Python sources in the tree"
    status: approved
    release: v0.3.0
    description: >
      The required Quality & Security Gate fails if `git ls-files '*.go' '*.py'` lists anything.
    fields:
      method: automated-test
      test-location: .github/workflows/ci.yml
      test-name: "Quality & Security Gate: No Go or Python sources"
    links:
      - type: verifies
        target: REQ-KS-064
      - type: verifies
        target: REQ-KS-041

  - id: VER-KS-015
    type: verification
    title: "Workflow scanner run-blocks rule classifies every run: block with no crash"
    status: approved
    release: v0.3.0
    description: >
      Fixtures under testdata/kapsel/scan/run-blocks/ cover a shell block, a block with an
      expression, pwsh, `shell: python`, workflow and job `defaults.run.shell`, a `|` block, a
      `>` block, a heredoc and an `|| true` refusal. The tests assert each classification, that
      findings map to the original YAML line and column, that masking keeps every offset, and that
      no input crashes the parser. The fleet numbers are in docs/scanner-phase0.md.
    fields:
      method: automated-test
      test-location: crates/kapsel-scan/tests/run_blocks.rs
      test-name: "shell_block_plans, expression_stays_opaque_and_maps_to_the_yaml_column, pwsh_is_not_shell_and_the_next_block_still_scans, python_step_shell_is_not_shell, defaults_shell_applies_by_scope, multiline_block_maps_to_its_yaml_line, folded_block_refuses_at_the_right_line, heredoc_with_expression_is_checked_without_crash, or_true_refuses_with_rule_and_line, windows_runner_defaults_to_pwsh_unless_undecided, a_panic_is_caught_and_reported_as_a_crash_message, masking_keeps_every_offset,unterminated_expression_and_odd_text_do_not_crash, crash_free_over_the_fixtures_and_a_synthetic_corpus"
    links:
      - type: verifies
        target: REQ-KS-015
      - type: verifies
        target: FEAT-KS-011
