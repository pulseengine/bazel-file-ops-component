    type: verification
    title: "gosec blocks in the required Security Vulnerability Scan"
    status: verified
    description: "Historical record: this verified the TinyGo component shipped in v0.2.1. gosec scanned the Go sources; the Go sources and the gosec step were removed in v0.3.0 (#144). There is no Rust equivalent: clippy -D warnings and cargo-deny run instead, and neither checks file modes. Kept as the record of what v0.2.1 shipped."
