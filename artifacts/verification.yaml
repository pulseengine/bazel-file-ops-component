    description: "Historical record: this verified the TinyGo component shipped in v0.2.1. The TinyGo tests were deleted in v0.3.0 (#144). Rust equivalents: crates/kapsel-fileops/tests/ported.rs is_within_cases (includes work-other for work), crates/kapsel-fileops/src/security.rs security::tests::path_traversal and security::tests::dot_dot_component. TestValidatePathAllowedDirsBoundary has no one-to-one port. Ran in rust.yml run 46115737938 on f2355247 and locally (exit 0) on ws/trace 533534a. Through the shipped component: 02-confinement.json prefix-sibling-directory and prefix-sibling-through-symlink (the fileops equivalence test, crates/kapsel-fileops/tests/equivalence.rs)."
