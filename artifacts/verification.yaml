      steps: "cmd: CARGO_BUILD_JOBS=2 nice -n 19 cargo test --locked --workspace --no-fail-fast (or: cargo test --locked -p kapsel-check -p kapsel-analysis); local: exit 0 on ws/trace 533534a (macOS, 2026-11-28; crates/ and testdata/ identical to f2355247), 375 passed, 0 failed, every named test ok; ci: rust.yml run 46115737938 (job Rust workspace tests, step Test) on f2355247ca62aba5cb54471c7104b0e05a106b5b, success, every named test ok"
      test-location: crates/kapsel-check/tests/plant_pack.rs; crates/kapsel-check/src/tests.rs; crates/kapsel-analysis/src/tests.rs
      test-name: plant_pack_through_the_real_parser, tests::plant_pack_files_agree_with_rules, tests::every_rule_catches_its_planted_case_and_passes_its_control, tests::every_rule_id_has_a_case, tests::s001_planted_*/s001_control_*, s002_*, s003_planted/s003_control, s004_planted/s004_control, s005_planted/s005_control
