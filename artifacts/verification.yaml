artifacts:
  - id: VER-KS-001
    type: verification
    title: "JSON destinations stay inside the workspace"
    status: verified
    release: v0.2.2
    fields:
      method: automated-test
      test-location: tinygo/confinement_test.go
      test-name: "TestJsonDestinationsStayInWorkspace, TestJsonDestinationThroughSymlinkRejected, TestCopyIntoExistingSymlinkRefused, TestWriteThroughExistingFileSymlinkRefused, TestDotDotInWorkDirAndWorkspaceRefused"
    links:
      - type: verifies
        target: REQ-KS-001
      - type: verifies
        target: FEAT-KS-001

  - id: VER-KS-002
    type: verification
    title: "run_command bounds"
    status: verified
    release: v0.2.2
    fields:
      method: automated-test
      test-location: tinygo/confinement_test.go
      test-name: TestJsonRunCommandBounds
    links:
      - type: verifies
        target: REQ-KS-002

  - id: VER-KS-003
    type: verification
    title: "move_path sources stay inside the workspace"
    status: verified
    release: v0.2.2
    fields:
      method: automated-test
      test-location: tinygo/confinement_test.go
      test-name: "TestJsonMoveSourceStaysInWorkspace, TestMoveSourceSymlinkDotDotRefused"
    links:
      - type: verifies
        target: REQ-KS-003

  - id: VER-KS-004
    type: verification
    title: "Separator-boundary containment"
    status: verified
    release: v0.2.1
    fields:
      method: automated-test
      test-location: tinygo/confinement_test.go
      test-name: "TestIsWithin, TestValidatePathAllowedDirsBoundary, TestContainsPathTraversal"
    links:
      - type: verifies
        target: REQ-KS-004
      - type: verifies
        target: DD-KS-001

  - id: VER-KS-005
    type: verification
    title: "gosec blocks in the required Security Vulnerability Scan"
    status: verified
    release: v0.2.1
    fields:
      method: automated-test
      test-location: .github/workflows/security.yml
      test-name: "Run Gosec Security Scanner (Go)"
    links:
      - type: verifies
        target: REQ-KS-005

  - id: VER-KS-006
    type: verification
    title: "The WASI component refuses escapes under wasmtime"
    status: verified
    release: v0.2.2
    fields:
      method: demonstration
      steps:
        - "bazel build //tinygo:file_ops_component"
        - "wasmtime run --dir <tmp>::/w with configs that move through link/.. and copy into a symlinked subdirectory"
        - "Both runs fail with a refusal and nothing outside the workspace changes"
    links:
      - type: verifies
        target: FEAT-KS-001

  - id: VER-KS-007
    type: verification
    title: "The Rust component matches the TinyGo v0.2.2 artifact on the equivalence corpus"
    status: approved
    release: v0.3.0
    description: >
      Every case in testdata/kapsel/fileops runs under wasmtime with the sha256-pinned v0.2.2
      file_ops_component.wasm and with the Rust build; files, stdout, stderr and exit codes must
      agree, or the case allowlists the difference with its reason.
    fields:
      method: automated-test
      test-location: crates/kapsel-fileops/tests/equivalence.rs
      test-name: "rust_component_matches_tinygo_oracle (--ignored), run by the required Component Build & Test jobs, by Integration Testing on the AOT-embedded build and by release.yml on both assets before publishing"
    links:
      - type: verifies
        target: REQ-KS-041

  - id: VER-KS-008
    type: verification
    title: "No Go or Python sources in the tree"
    status: approved
    release: v0.3.0
    description: >
      The required Quality & Security Gate fails if `git ls-files '*.go' '*.py'` lists anything.
    fields:
      method: automated-test
      test-location: .github/workflows/ci.yml
      test-name: "Quality & Security Gate: No Go or Python sources"
    links:
      - type: verifies
        target: REQ-KS-064
      - type: verifies
        target: REQ-KS-041
