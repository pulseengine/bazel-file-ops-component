  - id: VER-KS-015
    type: verification
    title: Exit codes through the shipped component and the binary
    status: verified
    release: v0.3.0
    description: The shipped file_ops_component.wasm and its AOT asset exit with the TinyGo oracle's code (0 or 1) on all 197 equivalence cases (ci.yml run 46161929013 on 3eac58b, ubuntu-24.04, macos-latest and the AOT asset); the kapsel binary's 64, 65, 70, 78 and pass-through statuses are asserted, and built-in status 2 (grep on a missing file), command status 1 (false) and exit 7 are asserted through the binary. CI builds with Rust 1.100.0; a test reads rust-toolchain.toml, the workspace rust-version and every crate's rust-version and fails if any is below 1.100, and another fails if the layer in varve.toml is older than 2026.11.28.
