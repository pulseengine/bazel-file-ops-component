  - id: VER-KS-028
    type: verification
    title: The plan schema is published, generated from the types, and every plan validates
    status: verified
    release: v0.3.0
    description: "schemas/kapsel.plan.v0.json is the JSON Schema of CheckOutcome (Plan, Refusal, Finding), generated from the kapsel-plan types with schemars (feature schema). A test regenerates it and fails if the committed file differs (KAPSEL_BLESS=1 re-blesses). Every plan and refusal that kapsel check --json produces over the plant pack, the parse goldens, the error corpus and the dash corpus validates against it (jsonschema crate), and a second test shows the schema rejects a plan without grants, body or source_sha256, a refusal without findings or schema, an unknown severity or outcome and a non-string rule. Grant completeness (01fef4f): every dash-corpus script and acceptance command whose plan has grants.dynamic false runs once as usual and once with --grants-from-plan (exactly the plan's read and write paths, not the current directory), and the two runs must agree on stdout, stderr, status and files; dropping any single grant (--drop-grant) must change the run for at least one grant of every script that has any. Scope: plans with grants.dynamic true say their lists are incomplete and are skipped. The native list is always empty in v0.3 because a command that needs a native tool is refused (KS-R009, unknown_command_is_refused_not_run); a refusal the command needs is checked by the plant pack (plant_pack_through_the_real_parser)."
    fields:
      method: automated-test
      steps: "cmd: cargo test --locked -p kapsel-plan --test schema -p kapsel-cli --test plan_schema --test grants_from_plan; ci: rust.yml run 46161929116 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d, job Rust workspace tests, step Test (cargo test --locked --workspace --no-fail-fast with KAPSEL_REQUIRE_STRACE=1): 494 passed, 0 failed, 3 ignored, run success; the same 494 passed in ci.yml run 46161929013 on 3eac58b657d59e174ff0efc10f14fe6baa0f3e0d (job Integration Testing, step Test workspace), success; every named test ok in both logs, except tests marked --ignored, which are cited separately"
      test-location: crates/kapsel-plan/tests/schema.rs; crates/kapsel-cli/tests/plan_schema.rs; crates/kapsel-cli/tests/grants_from_plan.rs
      test-name: committed_schema_matches_the_rust_types, schema_names_the_types_and_the_version_field, every_plan_and_refusal_validates_against_the_published_schema, the_schema_rejects_documents_that_break_the_contract, every_static_plan_runs_with_exactly_its_grants_and_fails_without_one, grants_from_plan_flag_errors
    links:
      - type: verifies
        target: REQ-KS-013
