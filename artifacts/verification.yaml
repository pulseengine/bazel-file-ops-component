        target: REQ-KS-005

  - id: VER-KS-006
    type: verification
    title: "The WASI component refuses escapes under wasmtime"
    status: verified
    description: "Historical record: this verified the TinyGo component shipped in v0.2.2, built with bazel from //tinygo (deleted in v0.3.0, #144). Rust equivalent: crates/kapsel-fileops/tests/equivalence.rs rust_component_matches_tinygo_oracle runs the shipped file_ops_component.wasm under wasmtime on testdata/kapsel/fileops/02-confinement.json, which includes move-source-symlink-then-dotdot and directory-copy-into-existing-symlink, and must leave the same files and exit code as the v0.2.2 artifact (ci.yml run 46115737949, locally exit 0)."
    release: v0.2.2
    tags: [historical]
    fields:
      method: demonstration
      steps:
        - "bazel build //tinygo:file_ops_component"
        - "wasmtime run --dir <tmp>::/w with configs that move through link/.. and copy into a symlinked subdirectory"
        - "Both runs fail with a refusal and nothing outside the workspace changes"
    links:
      - type: verifies
        target: FEAT-KS-001

  - id: VER-KS-007
    type: verification
    title: "The Rust component matches the TinyGo v0.2.2 artifact on the equivalence corpus"
    status: verified
    release: v0.3.0
    description: >
      Every case in testdata/kapsel/fileops runs under wasmtime with the sha256-pinned v0.2.2
      file_ops_component.wasm and with the Rust build; files, stdout, stderr and exit codes must
      agree, or the case allowlists the difference with its reason.
    fields:
      method: automated-test
      test-location: crates/kapsel-fileops/tests/equivalence.rs
      test-name: "rust_component_matches_tinygo_oracle (--ignored), run by the required Component Build & Test jobs, by Integration Testing on the AOT-embedded build and by release.yml on both assets before publishing"
      steps: "cmd: cargo build --locked -p kapsel-fileops --target wasm32-wasip2 --release && CARGO_BUILD_JOBS=2 nice -n 19 cargo test --locked -p kapsel-fileops --test equivalence -- --ignored --nocapture; local: exit 0 on ws/trace 533534a (macOS, 2026-11-28, wasmtime from varve), 197 cases, 384 runs, 285 agree, 99 allowlisted, 0 disagree; ci: ci.yml run 46115737949 on f2355247ca62aba5cb54471c7104b0e05a106b5b, rust_component_matches_tinygo_oracle ok in Component Build & Test (ubuntu-24.04), Component Build & Test (macos-latest) and Integration Testing (AOT-embedded build), all success"
    links:
      - type: verifies
        target: REQ-KS-041

      - type: verifies
        target: DD-KS-012
  - id: VER-KS-008
    type: verification
    title: "No Go or Python sources in the tree"
    status: verified
