  - id: VER-KS-019
    type: verification
    title: Modules are signed, attest both hashes, and are cached by the normalized plan
    status: verified
    release: v0.3.0
    description: A sealed module round-trips both input hashes; a flipped byte, another key, a stripped signature, a missing attestation or an attested plan hash other than the key all fail verification; a whitespace-only change hits the cache and an argv change misses; tampered or wrongly keyed cache entries are rejected and removed; grants change the key but never enter a module; the CLI serves 'echo   hi' from the cache entry of 'echo hi'.
    fields:
      method: automated-test
