artifacts:
  - id: VER-KS-001
    type: verification
    title: "JSON destinations stay inside the workspace"
    status: verified
    description: "Historical record: this verified the TinyGo component shipped in v0.2.2. tinygo/confinement_test.go was deleted in v0.3.0 (#144). Rust equivalents in crates/kapsel-fileops/tests/ported.rs, ported one to one: json_destinations_stay_in_workspace, json_destination_through_symlink_rejected, copy_into_existing_symlink_refused, write_through_existing_file_symlink_refused, dot_dot_in_work_dir_and_workspace_refused. Ran in rust.yml run 46115737938 on f2355247 and locally (exit 0) on ws/trace 533534a. The same cases run through the shipped component in testdata/kapsel/fileops/02-confinement.json (the fileops equivalence test, crates/kapsel-fileops/tests/equivalence.rs)."
    release: v0.2.2
    tags: [historical]
    fields:
      method: automated-test
      test-location: tinygo/confinement_test.go
      test-name: "TestJsonDestinationsStayInWorkspace, TestJsonDestinationThroughSymlinkRejected, TestCopyIntoExistingSymlinkRefused, TestWriteThroughExistingFileSymlinkRefused, TestDotDotInWorkDirAndWorkspaceRefused"
    links:
      - type: verifies
        target: REQ-KS-001
      - type: verifies
        target: FEAT-KS-001

  - id: VER-KS-002
    type: verification
    title: "run_command bounds"
    status: verified
    description: "Historical record: this verified the TinyGo component shipped in v0.2.2. TestJsonRunCommandBounds was deleted in v0.3.0 (#144). Rust equivalent: crates/kapsel-fileops/tests/ported.rs json_run_command_bounds, plus json_run_command_cannot_spawn (the wasip2 component cannot spawn). Ran in rust.yml run 46115737938 on f2355247 and locally (exit 0) on ws/trace 533534a. Through the shipped component: 02-confinement.json run-command-* cases (the fileops equivalence test, crates/kapsel-fileops/tests/equivalence.rs)."
    release: v0.2.2
    tags: [historical]
    fields:
      method: automated-test
      test-location: tinygo/confinement_test.go
      test-name: TestJsonRunCommandBounds
    links:
      - type: verifies
        target: REQ-KS-002

  - id: VER-KS-003
    type: verification
    title: "move_path sources stay inside the workspace"
    status: verified
    description: "Historical record: this verified the TinyGo component shipped in v0.2.2. The TinyGo tests were deleted in v0.3.0 (#144). Rust equivalents: crates/kapsel-fileops/tests/ported.rs json_move_source_stays_in_workspace, move_source_symlink_dot_dot_refused. Ran in rust.yml run 46115737938 on f2355247 and locally (exit 0) on ws/trace 533534a. Through the shipped component: 02-confinement.json move-source-* cases (the fileops equivalence test, crates/kapsel-fileops/tests/equivalence.rs)."
