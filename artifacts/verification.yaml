      test-name: "Quality & Security Gate: No Go or Python sources"
      steps: "cmd: git ls-files '*.go' '*.py' (must print nothing); local: 0 files on ws/trace 533534a (2026-11-28); ci: ci.yml run 46115737949 on f2355247ca62aba5cb54471c7104b0e05a106b5b, job Quality & Security Gate, step 'No Go or Python sources (REQ-KS-041, REQ-KS-064)', success"
    links:
      - type: verifies
        target: REQ-KS-064
      - type: verifies
        target: REQ-KS-041

      - type: verifies
        target: DD-KS-012
  - id: VER-KS-009
    type: verification
    title: The parser accepts the decided subset and refuses everything else
    status: verified
    release: v0.3.0
    description: "Every accept case parses to its golden tree with exact spans, every one of the 54 refuse cases (if, case, functions, subshells, backquotes, arithmetic, process substitution, here-strings, ...) yields parse errors naming the construct, the tree is lossless on all goldens, dash accepts every accept case, the corpus parses, and a parse error becomes a KS-R000 refusal through the real parser. A refusal never runs: the no-run-without-a-plan tests in crates/kapsel-cli/tests show it."
    fields:
      method: automated-test
      steps: "cmd: CARGO_BUILD_JOBS=2 nice -n 19 cargo test --locked --workspace --no-fail-fast (or: cargo test --locked -p kapsel-syntax --test golden; cargo test --locked -p kapsel-check); local: exit 0 on ws/trace 533534a (macOS, 2026-11-28; crates/ and testdata/ identical to f2355247), 375 passed, 0 failed, every named test ok; ci: rust.yml run 46115737938 (job Rust workspace tests, step Test) on f2355247ca62aba5cb54471c7104b0e05a106b5b, success, every named test ok"
      test-location: crates/kapsel-syntax/tests/golden.rs; crates/kapsel-check/tests/plant_pack.rs; crates/kapsel-check/src/tests.rs
      test-name: accept_goldens, accept_spans_exact_and_nested, refuse_goldens, lossless_on_all_goldens, dash_accepts_accept_cases, corpus_parses, incomplete_inputs; plant_pack_through_the_real_parser (KS-R000); tests::parse_errors_become_r000_one_each
    links:
      - type: verifies
        target: REQ-KS-010
      - type: verifies
        target: DD-KS-002

