      steps: "cmd: CARGO_BUILD_JOBS=2 nice -n 19 cargo test --locked --workspace --no-fail-fast (or: cargo test --locked -p kapsel-check; cargo test --locked -p kapsel-cli --test acceptance); local: exit 0 on ws/trace 533534a (macOS, 2026-11-28; crates/ and testdata/ identical to f2355247), 375 passed, 0 failed, every named test ok; ci: rust.yml run 46115737938 (job Rust workspace tests, step Test) on f2355247ca62aba5cb54471c7104b0e05a106b5b, success, every named test ok"
