    type: verification
    title: kapsel check runs nothing (one input)
    status: implemented
    release: v0.3.0
    description: "kapsel check --json on 'cat a | sort -u > b' prints the plan and b is not created; a refused input exits 65. PARTIAL: REQ-KS-011's criterion covers every input and also process spawn and network access; only one plan input is checked for writes, and nothing checks spawns or network. Missing test: run kapsel check over the plant pack, the parse goldens and the error corpus in an empty scratch directory and assert no file is created or changed and no child process starts."
    fields:
      method: automated-test
      steps: "cmd: CARGO_BUILD_JOBS=2 nice -n 19 cargo test --locked --workspace --no-fail-fast (or: cargo test --locked -p kapsel-cli --test acceptance); local: exit 0 on ws/trace 533534a (macOS, 2026-11-28; crates/ and testdata/ identical to f2355247), 375 passed, 0 failed, every named test ok; ci: rust.yml run 46115737938 (job Rust workspace tests, step Test) on f2355247ca62aba5cb54471c7104b0e05a106b5b, success, every named test ok"
      test-location: crates/kapsel-cli/tests/acceptance.rs
      test-name: check_json_reports_the_plan_grants, check_json_of_a_refusal_exits_65
    links:
      - type: verifies
        target: REQ-KS-011

