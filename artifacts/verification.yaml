      test-location: crates/kapsel-fileops/tests/equivalence.rs; crates/kapsel-cli/tests/acceptance.rs; crates/kapsel-cli/tests/exit_codes.rs
      test-name: rust_component_matches_tinygo_oracle (--ignored), usage_errors_exit_64, invalid_grants_exit_78, a_missing_key_file_is_an_internal_error, script_status_is_the_last_command, a_failing_built_in_exits_2_and_false_exits_1_and_exit_7_exits_7, rust_toolchain_and_every_rust_version_are_at_least_1_100, varve_toolchain_layer_is_2026_11_28_or_later
    links:
