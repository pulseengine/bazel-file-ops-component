artifacts:
  - id: FEAT-KS-001
    type: feature
    title: "Path confinement in JSON-config mode"
    status: verified
    release: v0.2.2
    description: "JSON-config operations stay inside the workspace they declare."
    fields:
      acceptance-criteria:
        - "A destination outside workspace_dir, by '..', an absolute path or a symlink, fails and writes nothing"
        - "A raw path with a '..' component is refused"
        - "Nothing is written or created through an existing symlink"
    links:
      - type: satisfies
        target: REQ-KS-004
      - type: satisfies
        target: REQ-KS-005
      - type: satisfies
        target: REQ-KS-001
      - type: satisfies
        target: REQ-KS-002
      - type: satisfies
        target: REQ-KS-003

  - id: FEAT-KS-010
    type: feature
    title: "kapsel check: analyze a command without running it"
    status: verified
    release: v0.3.0
    description: "Analyze any command and get a plan or a refusal with reasons, without running it."
    fields:
      phase: phase-1
      acceptance-criteria:
        - "Prints a plan or a refusal for -c or a script file and runs nothing"
        - "Every refusal names its rule id and quotes the source span"
        - "Parses every run: block in this repository's workflows without a crash"
    links:
      - type: satisfies
        target: REQ-KS-018
      - type: satisfies
        target: REQ-KS-010
      - type: satisfies
        target: REQ-KS-011
      - type: satisfies
        target: REQ-KS-012
      - type: satisfies
        target: REQ-KS-013
      - type: satisfies
        target: REQ-KS-014

      - type: satisfies
        target: REQ-KS-060
      - type: satisfies
        target: REQ-KS-061
      - type: satisfies
        target: REQ-KS-062
  - id: FEAT-KS-011
    type: feature
    title: "Workflow scanner report (Phase 0)"
    status: approved
    release: v0.3.0
    description: "A report of what kapsel would refuse or need in every workflow, produced offline."
    fields:
      phase: phase-1
      acceptance-criteria:
        - "One report artifact per run, a section per repository, with ${{ }} opaque"
        - "Finds the `|| echo` in ci.yml's Integration Testing step on the pre-fix revision"
        - "Runs advisory beside the current CI for at least one release before any gate uses it"
    links:
      - type: satisfies
        target: REQ-KS-015
      - type: satisfies
        target: REQ-KS-016

  - id: FEAT-KS-012
    type: feature
    title: "Bazel's file_ops toolchain runs on kapsel (Phase 1)"
    status: approved
    release: v0.4.0
    description: "rules_wasm_component's file operations run on kapsel instead of a separate Go wrapper."
    fields:
      phase: phase-1
      acceptance-criteria:
        - "rules_wasm_component's four file_ops call sites pass with kapsel in place of the Go wrapper"
        - "A misspelled operation fails, as rules_wasm_component's planted control requires"
    links:
      - type: satisfies
        target: REQ-KS-017

  - id: FEAT-KS-020
    type: feature
    title: "kapsel run: compile a checked command to WASM and run it"
    status: verified
    release: v0.3.0
    description: "Run a checked command as a compiled, cached WASM module under granted directories."
    fields:
      phase: phase-2
      acceptance-criteria:
        - "The same command twice compiles to a byte-identical module, and the second run hits the cache"
        - "An invalid --rw or --ro grant exits 78 and runs nothing"
        - "Every corpus script gives the same stdout, exit status and files as dash on Linux"
    links:
      - type: satisfies
        target: REQ-KS-020
      - type: satisfies
        target: REQ-KS-021
      - type: satisfies
        target: REQ-KS-022
      - type: satisfies
        target: REQ-KS-019
  - id: FEAT-KS-021
    type: feature
    title: "Built-in commands, first batch"
    status: verified
    release: v0.3.0
    description: "The most-used commands run inside kapsel without leaving the WASM sandbox."
    fields:
      phase: phase-2
      acceptance-criteria:
        - "Each built-in matches GNU coreutils output on its measured flag set, on a pinned test corpus"
        - "A built-in reaches only the preopened directories"
    links:
      - type: satisfies
        target: REQ-KS-025

  - id: FEAT-KS-022
    type: feature
    title: "Edit files and structured data without an interpreter"
    status: verified
    release: v0.3.0
    description: >
      Built-ins for what python, perl, node and awk were measured to do in agent shell calls:
      `edit` (literal, regex and multi-line replace in a file, splice by line range), `json`
      (get, set, del, merge), `yaml` and `toml` (get and set that keep comments), `field`,
      `lines`, `base64` and `sha256sum`. KS-R009 names the covering built-in when it refuses an
      interpreter.
    fields:
      phase: phase-2
      acceptance-criteria:
        - "An edit that matches nothing, or not exactly the count -c names, exits 1 and leaves the file byte for byte as it was"
        - "Every write is a temporary file in the same directory renamed over FILE, checked against the write grant, and refused through a symlink"
        - "A yaml or toml set or del changes the edited node only: the rest of a commented file is byte-exact (goldens in kapsel-host/tests/builtins2.rs)"
        - "kapsel check lists each writer's FILE as read and written, and each get form's FILE as read"
        - "KS-R009 on python, python3, perl, node, ruby, awk, jq and yq names the built-in for the common use"
        - "The scripts in testdata/kapsel/builtins2/ give their recorded stdout and files"
    links:
      - type: satisfies
        target: REQ-KS-063

  - id: FEAT-KS-030
    type: feature
    title: "Native tools from an allowlist"
    status: approved
    release: v0.5.0
    description: "git, cargo, bazel and other native tools run only from an allowlist with per-tool rules."
    fields:
      phase: phase-2
      acceptance-criteria:
        - "An unlisted program, a changed inode, an unlisted env name or a cwd outside the grants is refused"
        - "On Linux a cargo build script cannot exec outside target/ and the toolchain"
        - "A wrapper (timeout, xargs, env, bash -c) is checked as the command it wraps"
    links:
      - type: satisfies
        target: REQ-KS-030
      - type: satisfies
        target: REQ-KS-031
      - type: satisfies
        target: REQ-KS-032
      - type: satisfies
        target: REQ-KS-034

  - id: FEAT-KS-031
    type: feature
    title: "git through the broker"
    status: approved
    release: v0.5.0
    description: "Agents use git normally while only a broker writes .git and signs commits."
    fields:
      phase: phase-2
      acceptance-criteria:
        - "status, diff and log work under a read-only .git"
        - "A planted write to .git/hooks from the session fails"
        - "Commits are signed by the broker, and the session never reads the key"
    links:
      - type: satisfies
        target: REQ-KS-033

  - id: FEAT-KS-032
    type: feature
    title: "kapsel as a GitHub Actions shell (Phase 2)"
    status: approved
    release: v0.5.0
    description: "Workflow steps run through kapsel under zwinger."
    fields:
      phase: phase-2
      acceptance-criteria:
        - "A workflow step with `shell: kapsel {0}` runs under zwinger in kapsel's and zwinger's own CI"
        - "The step's plan appears in the job log"
    links:
      - type: satisfies
        target: REQ-KS-035

  - id: FEAT-KS-040
    type: feature
    title: "Protected kapsel steps"
    status: approved
    release: v1.0.0
    description: "A kapsel step earns the word protected only when all five conditions hold."
    fields:
      phase: phase-3
      acceptance-criteria:
        - "All five conditions of REQ-KS-040 hold for every kapsel step in kapsel's and zwinger's CI"
        - "The Rust JSON-config mode passes the equivalence test against the TinyGo artifact"
    links:
      - type: satisfies
        target: REQ-KS-040
      - type: satisfies
        target: REQ-KS-041

  - id: FEAT-KS-023
    type: feature
    title: "kapsel run under zwinger's grants, on wasmtime and on kiln"
    status: approved
    release: v0.4.0
    description: "Split from FEAT-KS-020 (2026-11-28): the grant handover from zwinger and the second runtime belong to v0.4.0."
    fields:
      phase: phase-2
      acceptance-criteria:
        - "Missing or invalid ZWINGER_GRANTS exits 78 and preopens nothing"
        - "Every corpus script gives the same output and exit code on wasmtime and kiln"
        - "Built-ins run as composed components behind the command WIT"
    links:
      - type: satisfies
        target: REQ-KS-023
      - type: satisfies
        target: REQ-KS-024
      - type: satisfies
        target: REQ-KS-026
