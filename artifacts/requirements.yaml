artifacts:
  # --- Shipped: path confinement of the JSON-config mode (0.2.1, 0.2.2) ---

  - id: REQ-KS-001
    type: requirement
    title: "JSON-config destinations resolve inside workspace_dir"
    status: verified
    release: v0.2.2
    description: >
      Every destination of a JSON-config operation (copy_file, copy_directory_contents, mkdir,
      write_file, append_to_file, concatenate_files, move_path, read_file's output_file) resolves
      inside workspace_dir after symlinks are followed. A raw path with a ".." component is
      refused before it is checked, and nothing is written or created through an existing
      symlink, at any level of a directory copy.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if any JSON-config destination writes, creates or moves a file outside workspace_dir through '..', an absolute path, a symlink or an existing symlink in the destination tree, without the run failing."
      upstream-ref: "GHSA-f5c6-8h5q-6486, GHSA-hm34-86h8-vwx2"

  - id: REQ-KS-002
    type: requirement
    title: "run_command's work_dir and output_file resolve inside the workspace or its parent"
    status: verified
    release: v0.2.2
    description: >
      The parent bound keeps rules_wasm_component's output_file "../<out>" working. The command
      itself is the one the config names; the config's author is trusted (owner, 2026-11-26).
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if run_command's work_dir or output_file resolves outside workspace_dir's parent without the run failing."

  - id: REQ-KS-003
    type: requirement
    title: "move_path sources resolve inside workspace_dir"
    status: verified
    release: v0.2.2
    description: >
      A move removes its source, so unlike copy sources a move_path source must resolve inside
      the workspace (owner, 2026-11-27).
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if move_path removes a file from outside workspace_dir."

  - id: REQ-KS-004
    type: requirement
    title: "Allowed-directory checks compare at a path-separator boundary"
    status: verified
    release: v0.2.1
    description: >
      Both sides are resolved (Abs plus EvalSymlinks) and compared with filepath.Rel, so an
      allowed /work does not admit /work-other.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if a path in a sibling with a shared name prefix (/work-other for /work) is accepted as inside."

  - id: REQ-KS-005
    type: requirement
    title: "Created directories are 0750 and files 0640, and gosec blocks"
    status: verified
    release: v0.2.1
    description: "gosec runs blocking in the required checks with tinygo/gosec.json setting the G302/G306 threshold to 0640; each #nosec states its reason. Historical (v0.2.1): this applied to the TinyGo component. Its Go sources, tinygo/gosec.json and the gosec step were removed in v0.3.0 (#144), so its gosec verification record is historical. The Rust component sets no file modes (wasip2 has no mode argument; the host decides), and the fileops equivalence test (crates/kapsel-fileops/tests/equivalence.rs) shows only that modes equal the v0.2.2 artifact's under wasmtime. No current test asserts 0750 or 0640."
    tags: [historical]
    fields:
      priority: should
      category: non-functional
      verification-criteria: "Fails if a created directory is wider than 0750 or a file wider than 0640, or if a gosec finding without a reasoned #nosec passes CI."

  # --- v0.3.0: the check stage ---

  - id: REQ-KS-010
    type: requirement
    title: "The parser accepts a defined POSIX subset and refuses everything else with a reason"
    status: verified
    release: v0.3.0
    description: >
      The subset is pipes, redirection, && and ||, ;, quoting, environment variables, globs,
      heredocs, $(...) and for/while/until loops (owner, 2026-11-27, from about 208,750 measured
      agent shell calls on 2 machines). Any other syntax is refused with a message naming the
      construct; it is never handed to bash or zsh.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if any construct outside the subset reaches execution, or a construct inside it is refused; checked against the planted corpus and the measured syntax list."
      upstream-ref: "kapsel#140"

  - id: REQ-KS-011
    type: requirement
    title: "Analysis is separate from execution"
    status: implemented
    release: v0.3.0
    description: >
      A check stage parses a command, applies the grammar and the policy, and names the grants,
      built-ins and native tools it needs. It returns a plan or a refusal with reasons and runs
      nothing.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if kapsel check performs any filesystem write, process spawn or network access for any input."
      upstream-ref: "kapsel#140"

  - id: REQ-KS-012
    type: requirement
    title: "Constructs that destroy the error signal are refused"
    status: implemented
    release: v0.3.0
    description: >
      `|| true` and `|| :` are refused, and the check stage reports each harmful construct with
      a reason. The rest of the list (swallowed failures, hidden errors, code from the network
      or from strings, destructive expansion, escaping the session's lifetime, bypassing native
      tool checks, killing by pattern) is settled per item as refuse or warn.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if a script containing `|| true` or `|| :` gets a plan instead of a refusal, or a refusal has no rule id and reason."
      upstream-ref: "kapsel#140"

  - id: REQ-KS-013
    type: requirement
    title: "The check stage's plan is a versioned JSON document"
    status: proposed
    release: v0.3.0
    description: >
      The plan lists each pipeline stage, the built-in or native tool it uses, the read and
      write grants and native programs it needs, and every refusal or warning with its rule id.
      A schema version field lets zwinger consume it (`zwinger explain PROFILE -- <command>`).
    fields:
      priority: should
      category: interface
      verification-criteria: "Fails if a plan does not validate against the published JSON schema, or omits a grant, native tool or refusal the command needs."

  - id: REQ-KS-014
    type: requirement
    title: "kapsel takes a command with -c or from a script file, with defined exit codes"
    status: implemented
    release: v0.3.0
    description: >
      `kapsel check` and `kapsel run` accept `-c <command>` and a script-file argument (GitHub
      Actions custom shells pass `{0}`). The exit codes for refusal, invalid grants (78) and
      command failure are distinct and documented.
    fields:
      priority: must
      category: interface
      verification-criteria: "Fails if -c and a script file with the same content give different results, or two failure kinds share an exit code."

  - id: REQ-KS-015
    type: requirement
    title: "The workflow scanner checks every run: block of a repository's workflows offline"
    status: approved
    release: v0.3.0
    description: >
      Phase 0 of the dogfooding rollout (owner, 2026-11-27): `kapsel check` over GitHub
      workflow run: blocks with ${{ ... }} treated as opaque, producing one report per run.
      Workflow YAML is read with rivet-yaml pinned by rivet tag (rivet#1099).
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if any run: block in a scanned repository is missing from the report, or a ${{ }} expression changes the verdict."

  - id: REQ-KS-016
    type: requirement
    title: "Every refusal rule has a planted script and a planted control"
    status: verified
    release: v0.3.0
    description: >
      The refusal corpus is a plant pack in this repository: each rule has a script that must be
      refused and a control that must pass, and CI fails if either flips.
    fields:
      priority: must
      category: non-functional
      verification-criteria: "Fails if any refusal rule lacks a planted script or a planted control, or CI passes while either flips."

  - id: REQ-KS-017
    type: requirement
    title: "JSON-config mode accepts a relative workspace_dir and fails on an unknown operation"
    status: verified
    release: v0.3.0
    description: >
      rules_wasm_component writes workspace_dir "." with execroot-relative paths (#776). kapsel
      resolves them against its working directory and keeps every destination inside the
      workspace; an unknown operation is an error. This lets its file_ops toolchain swap the Go
      wrapper for kapsel (owner, 2026-11-27).
    fields:
      priority: must
      category: interface
      verification-criteria: "Fails if a config with workspace_dir \".\" and execroot-relative paths is rejected, a destination escapes the workspace, or an unknown operation does not fail."
      upstream-ref: "rules_wasm_component#775"
      effect: behaviour

  - id: REQ-KS-018
    type: requirement
    title: "Rust components follow the fleet exit-code rule"
    status: implemented
    release: v0.3.0
    description: >
      Rust 1.100 or later pinned, std::process::exit on WASI, and every exit code asserted
      through the shipped component (fleet rule, 2026-11-27). The toolchain layer is covalent
      2026.11.28 or later.
    fields:
      priority: must
      category: constraint
      verification-criteria: "Fails if the pinned Rust toolchain is older than 1.100, or any exit code is not asserted through the shipped component."

  - id: REQ-KS-019
    type: requirement
    title: "Interactive mode compiles and runs each line, and the session state persists"
    status: implemented
    release: v0.3.0
    description: >
      With no command and no script, kapsel reads lines from a terminal. Each complete line goes
      through check, compile and run like `-c` does (owner, 2026-11-27: every set of commands is
      compiled and executed). Variables, exported names, the working directory and `$?` persist
      from one line to the next; a refused line prints its findings and leaves the session as it
      was.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if a line runs without being checked and compiled, a refused line changes the session, or cd or an assignment on one line is not visible on the next."
      upstream-ref: "kapsel#140"
    links:
      - type: derives-from
        target: REQ-KS-014

  - id: REQ-KS-060
    type: requirement
    title: "Every refusal, warning and run error says what is wrong, where, and what to do"
    status: verified
    release: v0.3.0
    description: >
      Diagnostics are rendered rustc-style: rule id, file:line:col, the source line with the span
      underlined, related spans, a help line with a concrete fix and a note on why the rule
      exists. `kapsel explain <rule>` prints the long form. Parse errors name the construct and
      what was expected; built-in errors name the built-in, the operand and the supported flags
      (owner, 2026-11-27: "a big one on error reporting wrong inputs").
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if any finding or parse error lacks a span, a rule id or a help line, or a golden diagnostic changes without being blessed."
      upstream-ref: "kapsel#140"

  - id: REQ-KS-061
    type: requirement
    title: "Commands that repeat an earlier command with a small difference are analysed together"
    status: verified
    release: v0.3.0
    description: >
      A salsa database holds every command of a script or session. The analysis compares command
      shapes and reports retries without change, inconsistent flags, near-miss paths, duplicated
      commands and destructive near-misses (KS-S001 to KS-S005), with the related command as a
      secondary span (owner, 2026-11-27).
    fields:
      priority: should
      category: functional
      verification-criteria: "Fails if a planted case for a KS-S rule is not reported with its related span, a control is reported, or editing one command recomputes the analysis of unrelated commands."
      upstream-ref: "kapsel#140"

  - id: REQ-KS-062
    type: requirement
    title: "Real mistakes from CI and agent sessions form a regression corpus"
    status: implemented
    release: v0.3.0
    description: >
      testdata/kapsel/errors/ holds minimized, scrubbed cases from CI failures and failed agent
      shell calls (smithy: 428,316 calls on 2 machines, 11,551 failed, 2026-11-27), each with
      its expected outcome. New classes found later are added the same way. No raw transcript
      text or log is committed.
    fields:
      priority: must
      category: non-functional
      verification-criteria: "Fails if a corpus case's outcome differs from its expect line, or a committed case contains a home path, hostname, user name or token."
      upstream-ref: "kapsel#140"

  - id: REQ-KS-063
    type: requirement
    title: "Built-ins for file edits and structured data make python, perl and awk unnecessary for basic work"
    status: approved
    release: v0.3.0
    description: >
      Measured on this machine (80,836 agent shell calls, 2026-11-27): 19.1% used python, perl,
      node or ruby, and most of that was file editing, not data work. Built-ins cover, in order
      of calls replaced: in-place literal and regex substitution in a file, including multi-line
      (about 6,800 uses); JSON get by path (3,359); JSON set, delete and merge (1,649); YAML get
      (769); splice a file by line range (533); field and line-range selection now done with awk
      (about 3,100); base64 and sha256; YAML and TOML set preserving comments. With them, `python`,
      `perl`, `node` and `awk` stay refused (KS-R009) and the refusal names the built-in to use
      (owner, 2026-11-27: "no python needed for basic stuff anymore, e.g. yaml or json").
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if any of the measured operations above has no built-in, a YAML or TOML edit loses a comment, or a refusal of python, perl, node or awk for a covered purpose does not name the built-in."
      upstream-ref: "kapsel#140"

  - id: REQ-KS-064
    type: requirement
    title: "The repository has no Python, and no Go once the JSON-config mode is Rust"
    status: implemented
    release: v0.3.0
    description: >
      scripts/check_selfhosted_fork_guard.py becomes the first rule of kapsel's workflow scanner
      (REQ-KS-015), ported with the Python script as the equivalence oracle. The TinyGo component
      is deleted once the Rust JSON-config mode (REQ-KS-041) passes its equivalence test (owner,
      2026-11-27: everything in v0.3.0).
    fields:
      priority: must
      category: constraint
      verification-criteria: "Fails if a .py or .go file remains in the repository at the v0.3.0 tag (the fork-guard oracle is kept only as frozen test data, testdata/kapsel/scan/oracle/*.py.frozen), or the Rust fork-guard rule passes a workflow the Python script fails, except for the pinned, reasoned cases: the script's false positive on runs-on text inside a run: block, and the semantically guarded variants the owner approved on 2026-11-28 (hosted fallback other than ubuntu-24.04, trailing comment, nested selection, matrix guards whose self-hosted entries say self-hosted, matrix.os conditionals, anchors and aliases)."
      upstream-ref: "kapsel#140"
    links:
      - type: derives-from
        target: REQ-KS-041

  # --- v0.4.0: compile and run ---

  - id: REQ-KS-020
    type: requirement
    title: "A checked plan compiles to a WASM component that calls kapsel's interfaces"
    status: approved
    release: v0.3.0
    description: >
      The compiler turns a plan into a component of world `kapsel:shell/plan` that imports only
      `kapsel:shell/host@0.1.0` (wit/kapsel-shell.wit): built-ins, expansion and session state are
      host calls, and all control flow is compiled in. The same plan and the same interface
      versions produce a byte-identical module. Built-ins as composed `command` components and
      native tools through native-exec replace host calls in v0.4.0 and v0.5.0 (REQ-KS-024,
      REQ-KS-030); this text was narrowed to the first-shell design on 2026-11-28.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if one plan compiled twice with the same interface versions gives two different modules, or a compiled module imports anything other than kapsel:shell/host@0.1.0."

  - id: REQ-KS-021
    type: requirement
    title: "Compiled modules are signed with sigil, attest both input hashes, and are cached by the normalized one"
    status: verified
    release: v0.3.0
    description: >
      Every compiled module is signed with sigil (wsc) and carries a transformation attestation
      whose inputs are the source (raw sha256) and the normalized plan (sha256 of the plan without
      spans, source hash and warnings), whose output is the module, and whose tool entry names
      the compiler version and the WIT version. The cache is keyed by normalized plan hash plus
      compiler and WIT versions, so whitespace and comment changes reuse the module. A cached
      module runs only after its signature verifies and its attested plan hash equals the key
      (owner, 2026-11-27: sign with sigil, reference the input hash and a normalized hash, cache
      for performance work).
    fields:
      priority: must
      category: non-functional
      verification-criteria: "Fails if a module whose attested normalized-plan hash differs from the cache key is run, a whitespace-only change misses the cache, a grant appears in a compiled module, or an unsigned or wrongly signed module runs."

  - id: REQ-KS-022
    type: requirement
    title: "The executor runs only plans the check stage produced"
    status: verified
    release: v0.3.0
    description: >
      There is no path from a command line to execution that skips the check stage.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if any input executes without a plan from the check stage."

  - id: REQ-KS-023
    type: requirement
    title: "The host takes its grants from ZWINGER_GRANTS and fails closed"
    status: approved
    release: v0.4.0
    description: >
      The native host binary embeds the runtime and reads ZWINGER_GRANTS (schema
      zwinger.grants.v1): each read entry becomes a read-only preopen PATH::PATH, each write
      entry a read-write one. A missing or invalid plan, or an unknown schema, exits 78; it never
      preopens the current directory instead.
    fields:
      priority: must
      category: interface
      verification-criteria: "Fails if a missing, invalid or unknown-schema ZWINGER_GRANTS does not exit 78, or any directory is preopened that the grants do not name."
      upstream-ref: "kapsel#140 seam kapsel-zwinger/agent-shell"

  - id: REQ-KS-024
    type: requirement
    title: "Tools implement one `command` WIT interface"
    status: approved
    release: v0.4.0
    description: >
      run(args, env, stdin, stdout, stderr) returns an exit code. Each tool exports it, the
      shell imports the tools it knows, and the parts are composed into one component.
    fields:
      priority: must
      category: interface
      verification-criteria: "Fails if a built-in cannot be swapped for another component implementing the same interface without changing the shell."

  - id: REQ-KS-025
    type: requirement
    title: "The most-used commands are built in"
    status: implemented
    release: v0.3.0
    description: >
      First batch, ranked by measured agent use: cat, echo, printf, head, tail, wc, ls, mkdir,
      cp, mv, rm, grep, sed, sort, uniq, cut, tr, tee, date, seq, sleep, each with the flags
      the measurement shows in use (for example grep -E -n -i -v -r -l -c -o -q, sed -n 'a,bp',
      sort -u -r -n -k).
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if a built-in's output or exit code differs from GNU coreutils on its measured flag set, on the pinned test corpus."

  - id: REQ-KS-026
    type: requirement
    title: "wasmtime and kiln agree on the whole corpus"
    status: approved
    release: v0.4.0
    description: >
      Every corpus script runs on wasmtime and on kiln (meld-fused, meld pinned). Any difference,
      errno differences included, is a failure. The corpus is published as a release asset with
      a sha256.
    fields:
      priority: must
      category: non-functional
      verification-criteria: "Fails if wasmtime and kiln differ in output, exit code or errno on any corpus script."

  - id: REQ-KS-027
    type: requirement
    title: "The subset widens to if, parameter operators, brace groups, arithmetic and case"
    status: approved
    release: v0.4.0
    description: >
      The v0.3.0 workflow scan read 2,977 run: blocks across the fleet with no parser crash, and
      kapsel accepted 56. The five most-refused constructs were `if` (886), `${x:-y}`-style
      parameter operators (519), `{ }` brace groups (401), `$(( ))` arithmetic (162) and `case`
      (94). v0.4.0 adds all five to the parser, check stage and compiler (owner, 2026-11-28).
      `${x:?message}` becomes the fix KS-R017 suggests, and arithmetic is 64-bit, proven with
      ordeal against shell semantics as the compiler's other rules are. Refusal rules that apply
      inside the new constructs keep their planted tests.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if any of the five constructs is refused, a refusal rule stops firing inside one of them, an arithmetic lowering has no ordeal certificate, or the scanner's accepted-block count on the v0.3.0 fleet snapshot does not rise."
      upstream-ref: "kapsel#140"

  - id: REQ-KS-028
    type: requirement
    title: "A browser playground runs kapsel against a directory the user grants"
    status: approved
    release: v0.4.0
    description: >
      A web page shows kapsel in action with the same parser, check stage, compiler and host,
      compiled to WebAssembly and loaded with jco (owner, 2026-11-28). Stage 1 is check-only: a
      typed command shows its plan, grants and any refusal with the rendered diagnostic. Stage 2
      runs the compiled component against files in the browser: the browser's private file system
      (OPFS) for a sample project, or a directory the user picks through the File System Access
      API, falling back to OPFS where that API is missing (Firefox, Safari). The picked directory is
      the session's only grant, so the browser's permission prompt plays the role of `--rw DIR`.
      Hosting, agreed with pulseengine.eu on 2026-11-28: the page lives at
      pulseengine.eu/kapsel/playground/. Each kapsel release publishes kapsel-playground-<v>.tar.gz,
      listed in the cosign-signed checksums; pulseengine.eu pins version and sha256, verifies the
      signature against kapsel's release-workflow identity on deploy, and each release opens a
      pin-bump PR there. The tarball carries everything (no CDN or third-party loads), the wasm
      loads after the first interaction and is served compressed (stage 1 at most 5 MB compressed,
      stage 2 at most 20 MB, sizes printed in the release notes), and the page says it is work in
      progress and that nothing leaves the browser.
    fields:
      priority: should
      category: functional
      verification-criteria: "Fails if the page's plan, refusal or output for a corpus script differs from the native kapsel binary at the same tag, a command reaches a file outside the granted directory, the page makes a network request after load, it loads anything from a third party, the stage 1 or stage 2 wasm exceeds 5 MB or 20 MB compressed, it fails without the File System Access API, or the published tarball was built from a different tag than the release."
      upstream-ref: "kapsel#140"

  # --- v0.5.0: native tools ---

  - id: REQ-KS-030
    type: requirement
    title: "Native tools run only through native-exec, enforced by the host"
    status: approved
    release: v0.5.0
    description: >
      kapsel's wasmtime host implements pulseengine:native-exec@0.1.0 (WIT in the kiln repo).
      It spawns exactly the canonical path it checked and refuses a changed device or inode,
      refuses an env name not on the program's list (not-allowed), always drops LD_* and DYLD_*,
      requires cwd inside a granted preopen, passes explicit stream handles, and reports death
      by signal as signaled(u8).
    fields:
      priority: must
      category: interface
      verification-criteria: "Fails if a program not on the allowlist runs, a replaced binary (changed device or inode) runs, an unlisted env name is passed, or cwd lies outside the grants."
      upstream-ref: "kiln#741"

  - id: REQ-KS-031
    type: requirement
    title: "One per-tool host profile schema, owned by kapsel and read by both hosts"
    status: approved
    release: v0.5.0
    description: >
      The profile names the canonical program path, the env names it may pass, forced args and
      env, cwd containment, and whether its children may execute and from which trees. It is
      loaded from ZWINGER_GRANTS.exec at startup, never taken from a request, and both kiln and
      kapsel's host enforce it.
    fields:
      priority: must
      category: interface
      verification-criteria: "Fails if a profile value can be supplied by a request, or kiln and kapsel's host accept a different set of requests for the same profile."
      upstream-ref: "kiln#741"

  - id: REQ-KS-032
    type: requirement
    title: "On Linux each native child gets its own Landlock domain"
    status: approved
    release: v0.5.0
    description: >
      The host applies the tool's ruleset just before exec, stacking on zwinger's session domain
      (owner, 2026-11-27: C now, D on Linux). macOS stays at host enforcement plus zwinger's
      session layer.
    fields:
      priority: should
      category: functional
      verification-criteria: "Fails if, on Linux, a native child can execute a file outside its tool's trees."

  - id: REQ-KS-033
    type: requirement
    title: "A per-session broker is the only writer of .git"
    status: approved
    release: v0.5.0
    description: >
      It takes structured requests, builds trees from the worktree itself, runs git with hooks,
      fsmonitor, includes and attribute drivers off, and holds the signing key. One broker per
      session on a local socket in the session socket directory (owner, 2026-11-27).
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if any process in the session writes .git, the broker accepts a tree, object or ref from the session, runs a hook, or exposes the signing key."

  - id: REQ-KS-034
    type: requirement
    title: "Wrapper commands are checked as the command they wrap"
    status: proposed
    release: v0.5.0
    description: >
      timeout, xargs, nice, env, sudo and bash -c execute their argument. The check stage treats
      each as the wrapped command, or refuses it; none is an allowlist entry in its own right.
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if a wrapper lets through a command the check stage would refuse when run directly."

  - id: REQ-KS-035
    type: requirement
    title: "kapsel works as a GitHub Actions shell under zwinger"
    status: approved
    release: v0.5.0
    description: >
      `shell: kapsel {0}` in a workflow step, first in zwinger's and kapsel's own repositories
      (Phase 2, owner, 2026-11-27).
    fields:
      priority: must
      category: functional
      verification-criteria: "Fails if a `shell: kapsel {0}` step in kapsel's or zwinger's CI runs outside zwinger or leaves no plan in the job log."

