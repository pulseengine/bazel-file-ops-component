name: Security & Dependencies

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans weekly
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # Security vulnerability scanning
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.23'
        cache-dependency-path: tinygo/go.sum

    - name: Run Gosec Security Scanner (Go)
      # Blocking: gosec exits non-zero on a finding or a load error. Until
      # 2026-11-26 this step installed github.com/securecodewarrior/gosec, a
      # path that no longer resolves, and continue-on-error hid the failure.
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
        cd tinygo
        gosec -fmt sarif -out ../go-results.sarif -stdout -verbose text ./...

    - name: Upload Gosec Results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      if: always() && hashFiles('go-results.sarif') != ''
      with:
        sarif_file: go-results.sarif
        category: go-security

    - name: Trivy gate (CRITICAL and HIGH with a fix available)
      # Blocking. The SARIF step below cannot gate: in SARIF mode trivy-action
      # drops the severity filter (limit-severities-for-sarif defaults to
      # false), so an exit-code there would fail on every LOW finding.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        exit-code: '1'

    - name: Run Trivy Vulnerability Scanner
      # Report only: every severity goes to the Security tab.
      if: always()
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        exit-code: '0'

    - name: Upload Trivy Results to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'
        category: trivy-security

    - name: Run Semgrep Security Analysis
      # Installed from PyPI: the semgrep-action container cannot be pulled on
      # the rootless self-hosted runner (newuidmap: write to uid_map failed).
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      run: |
        python3 -m venv "$RUNNER_TEMP/semgrep-venv"
        "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep==1.183.0
        if [ -n "$SEMGREP_APP_TOKEN" ]; then
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" ci
        else
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --config auto --error
        fi

    - name: Semgrep GitHub Actions rules (blocking)
      # Deterministic, metrics-free subset of the scan above. Its planted bad
      # input is control "semgrep-actions-mutable-tag" in ci-controls.toml.
      run: |
        "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --config p/github-actions --metrics off --error .github

  # Dependency vulnerability and license scanning
  dependency-check:
    name: Dependency Security Check
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.23'
        cache-dependency-path: tinygo/go.sum

    - name: Go Dependency Check
      # Blocking. tinygo/go.mod has no requirements today, so nancy audits 0
      # modules; it starts to bite when the first dependency is added.
      run: |
        go install github.com/sonatype-nexus-community/nancy@v1.0.52  # last release supporting Go 1.23
        cd tinygo
        go list -json -m all | nancy sleuth

    - name: License Compliance Check
      run: |
        # Install and run go-licenses tool
        echo "Installing go-licenses tool..."
        go install github.com/google/go-licenses@v1.6.0

        # Check for license compliance in dependencies
        echo "Scanning Go module licenses..."
        cd tinygo && go-licenses csv ./... > ../go-licenses.csv || echo "License scan completed with warnings"

        echo "Dependency license scan completed"

  # Automated dependency updates
  dependency-update:
    name: Automated Dependency Updates
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.23'
        cache-dependency-path: tinygo/go.sum

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
      with:
        toolchain: "1.82.0"

    - name: Update Go Dependencies
      run: |
        cd tinygo

        # Update go.mod
        go get -u ./...
        go mod tidy
        go mod verify

        # Check if there are changes
        if git diff --quiet go.mod go.sum; then
          echo "No Go dependency updates available"
        else
          echo "GO_DEPS_UPDATED=true" >> $GITHUB_ENV
        fi

    - name: Update Rust Dependencies
      run: |
        if [ -d "rust" ] && [ -f "rust/Cargo.toml" ]; then
          cd rust

          # Update Cargo.toml with latest compatible versions
          cargo update

          # Check if there are changes
          if git diff --quiet Cargo.lock; then
            echo "No Rust dependency updates available"
          else
            echo "RUST_DEPS_UPDATED=true" >> $GITHUB_ENV
          fi
        else
          echo "Rust directory not found - skipping Rust dependency updates"
        fi

    - name: Update Bazel Dependencies
      run: |
        # Check MODULE.bazel for updates (manual review needed)
        echo "Bazel MODULE.bazel dependencies should be updated manually"
        echo "Check for newer versions of:"
        grep -E "bazel_dep|use_extension" MODULE.bazel || true

    - name: Create Pull Request for Dependency Updates
      if: env.GO_DEPS_UPDATED == 'true' || env.RUST_DEPS_UPDATED == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'Automated Dependency Updates'
        body: |
          ## 🤖 Automated Dependency Updates

          This PR contains automated dependency updates:

          ${{ env.GO_DEPS_UPDATED == 'true' && '✅ Go dependencies updated' || '➖ No Go dependency updates' }}
          ${{ env.RUST_DEPS_UPDATED == 'true' && '✅ Rust dependencies updated' || '➖ No Rust dependency updates' }}

          ### Changes Made
          - Updated go.mod and go.sum (if applicable)
          - Updated Cargo.lock (if applicable)
          - All updates use compatible version constraints

          ### Testing
          - [ ] CI/CD pipeline passes
          - [ ] Security scans pass
          - [ ] No breaking changes introduced

          ### Manual Review Required
          - Verify no breaking changes in updated dependencies
          - Review any new security advisories
          - Check for any required code changes

          ---
          This PR was automatically created by the dependency update workflow.
        branch: automated-dependency-updates
        delete-branch: true

  # Supply chain security
  supply-chain-security:
    name: Supply Chain Security
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.23'
        cache-dependency-path: tinygo/go.sum

    - name: Run SBOM Generation
      run: |
        # Install SBOM tools - use fixed version for reliability
        SYFT_VERSION="v1.18.1"
        # smithy runner has no write access to /usr/local/bin; install into $HOME/.local/bin
        mkdir -p "$HOME/.local/bin"
        # Pinned release tarball verified by sha256 (was: install.sh from
        # syft's main branch piped to sh, so the installer itself was mutable).
        SYFT_SHA256=066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab
        curl -fsSLo syft.tar.gz "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
        echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
        tar xzf syft.tar.gz -C "$HOME/.local/bin" syft
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"

        # Generate SBOM for the repository
        syft . -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cyclonedx.json

        echo "SBOM files generated:"
        ls -la sbom.*

    - name: Upload SBOM Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: sbom-reports
        path: |
          sbom.spdx.json
          sbom.cyclonedx.json
        retention-days: 90

    - name: Verify Signatures (if available)
      run: |
        # Install cosign for signature verification
        curl -O -L https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
        # smithy runner has no sudo; install into $HOME/.local/bin and add to PATH
        mkdir -p "$HOME/.local/bin"
        mv cosign-linux-amd64 "$HOME/.local/bin/cosign"
        chmod +x "$HOME/.local/bin/cosign"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        echo "Signature verification tools installed"
        # Future: Add actual signature verification for dependencies

  # Security policy and compliance
  security-policy:
    name: Security Policy Compliance
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Check no fork PR reaches a self-hosted runner
      run: python3 scripts/check_selfhosted_fork_guard.py

    - name: Check Security Policy
      run: |
        # Verify SECURITY.md exists and is up to date
        if [ -f "SECURITY.md" ]; then
          echo "✅ Security policy exists"
        else
          echo "❌ Security policy missing"
          echo "Creating basic security policy template..."
          cat > SECURITY.md <<EOF
        # Security Policy

        ## Supported Versions

        We provide security updates for the following versions:

        | Version | Supported          |
        | ------- | ------------------ |
        | 1.x.x   | :white_check_mark: |
        | < 1.0   | :x:                |

        ## Reporting a Vulnerability

        Please report security vulnerabilities to security@pulseengine.dev

        We will acknowledge receipt within 48 hours and provide a detailed
        response within 7 days indicating the next steps.
        EOF
        fi

    - name: Security Configuration Check
      run: |
        echo "## 🔒 Security Configuration Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check for security-related files
        echo "### Security Files" >> $GITHUB_STEP_SUMMARY
        echo "- Security Policy: $([ -f SECURITY.md ] && echo '✅' || echo '❌')" >> $GITHUB_STEP_SUMMARY
        echo "- Code of Conduct: $([ -f CODE_OF_CONDUCT.md ] && echo '✅' || echo '❌')" >> $GITHUB_STEP_SUMMARY
        echo "- License: $([ -f LICENSE ] && echo '✅' || echo '❌')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Workflow Security" >> $GITHUB_STEP_SUMMARY
        echo "- Dependabot: $([ -f .github/dependabot.yml ] && echo '✅' || echo '❌')" >> $GITHUB_STEP_SUMMARY
        echo "- Security Scanning: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency Updates: ✅ Automated" >> $GITHUB_STEP_SUMMARY
