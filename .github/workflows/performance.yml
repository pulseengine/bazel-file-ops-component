name: Performance Monitoring

# Benchmarks of the JSON-config component (crates/kapsel-fileops, Rust since
# v0.3.0). Not a required check: results are reported, not gated.

on:
  # main, nightly and on demand only: the benchmarks are advisory and four
  # jobs per pull-request push crowded the fleet's hosted-runner queue
  # (2026-11-28); a regression still shows on main within a day.
  push:
    branches: [ main ]
  schedule:
    # Run performance tests nightly
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Type of benchmark to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - regular-only
        - aot-only

env:
  CARGO_TERM_COLOR: never
  # scripts/install-wasmtime.sh pins the binary and its sha256.
  WASMTIME_VERSION: "50.0.3"

jobs:
  # Performance benchmarking
  performance-benchmark:
    name: Performance Benchmark
    # Stays on hosted: sudo dpkg/brew + macOS matrix; smithy has none of these.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
      with:
        toolchain: 1.100.0
        targets: wasm32-wasip2

    - name: Install wasmtime
      run: scripts/install-wasmtime.sh

    - name: Install hyperfine
      run: |
        if [[ "${{ matrix.os }}" == "ubuntu-24.04" ]]; then
          curl -fsSLo hyperfine.deb https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb
          sudo dpkg -i hyperfine.deb
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          brew install hyperfine
        fi

    - name: Build component and host AOT code
      run: |
        cargo build --locked -p kapsel-fileops --target wasm32-wasip2 --release
        COMPONENT_WASM="$PWD/target/wasm32-wasip2/release/kapsel-fileops.wasm"
        AOT_COMPONENT="$RUNNER_TEMP/kapsel-fileops.cwasm"
        wasmtime compile -O opt-level=2 -D debug-info=n "$COMPONENT_WASM" -o "$AOT_COMPONENT"
        echo "COMPONENT_WASM=$COMPONENT_WASM" >> "$GITHUB_ENV"
        echo "AOT_COMPONENT=$AOT_COMPONENT" >> "$GITHUB_ENV"

    - name: Create Performance Test Data
      run: |
        mkdir -p perf_test_data
        dd if=/dev/zero of=perf_test_data/small.txt bs=1K count=1      # 1KB
        dd if=/dev/zero of=perf_test_data/medium.txt bs=1M count=1     # 1MB
        dd if=/dev/zero of=perf_test_data/large.txt bs=1M count=10     # 10MB
        mkdir -p perf_test_data/many_files
        for i in {1..100}; do
          echo "File $i content" > "perf_test_data/many_files/file_$i.txt"
        done

    - name: Benchmark component
      if: github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == 'regular-only' || github.event.inputs.benchmark_type == ''
      run: |
        D="$PWD"
        CMD="wasmtime run --dir $D::$D $COMPONENT_WASM copy_file --src $D/perf_test_data/large.txt --dest $D/perf_test_data/wasm_copy.txt"
        bash -c "$CMD"
        hyperfine --export-json wasm_benchmark.json --warmup 3 "$CMD"
        echo "## Component (${{ matrix.os }})" >> perf_results.md
        echo "- copy_file 10 MB: $(jq -r '.results[0].mean' wasm_benchmark.json)s mean" >> perf_results.md

    - name: Benchmark AOT code
      if: github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == 'aot-only' || github.event.inputs.benchmark_type == ''
      run: |
        D="$PWD"
        CMD="wasmtime run --allow-precompiled --dir $D::$D $AOT_COMPONENT copy_file --src $D/perf_test_data/large.txt --dest $D/perf_test_data/aot_copy.txt"
        bash -c "$CMD"
        hyperfine --export-json aot_benchmark.json --warmup 3 "$CMD"
        echo "## AOT (${{ matrix.os }})" >> perf_results.md
        echo "- copy_file 10 MB: $(jq -r '.results[0].mean' aot_benchmark.json)s mean" >> perf_results.md

    - name: Binary size
      run: |
        SIZE=$(wc -c < "$COMPONENT_WASM")
        echo "- Component size: $((SIZE / 1024)) KB" >> perf_results.md

    - name: Upload Performance Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: performance-results-${{ matrix.os }}
        path: |
          perf_results.md
          *_benchmark.json
        retention-days: 30

    - name: Comment Performance Results on PR
      if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      with:
        script: |
          const fs = require('fs');

          if (fs.existsSync('perf_results.md')) {
            const results = fs.readFileSync('perf_results.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Performance Benchmark Results\n\n${results}\n\n_Results from ${{ matrix.os }}_`
            });
          }

  # Memory and resource usage profiling
  resource-profiling:
    name: Resource Usage Profiling
    # Stays on hosted: /usr/bin/time -v from apt; not installed on smithy.
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
      with:
        toolchain: 1.100.0
        targets: wasm32-wasip2

    - name: Install Profiling Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y time
        scripts/install-wasmtime.sh

    - name: Build Component for Profiling
      run: cargo build --locked -p kapsel-fileops --target wasm32-wasip2 --release

    - name: Profile Component Memory Usage
      run: |
        echo "## Memory Usage Profiling" >> profile_results.md
        echo "" >> profile_results.md
        dd if=/dev/zero of=profile_test.dat bs=1M count=5
        D="$PWD"
        /usr/bin/time -v wasmtime run --dir "$D::$D" target/wasm32-wasip2/release/kapsel-fileops.wasm \
          copy_file --src "$D/profile_test.dat" --dest "$D/profile_copy.dat" 2> time.txt
        grep -E "(Maximum resident set size|User time|System time)" time.txt >> profile_results.md

    - name: Upload Profiling Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: resource-profiling-results
        path: |
          profile_results.md
        retention-days: 30

  # Performance regression detection
  regression-detection:
    name: Performance Regression Detection
    # Stays on hosted: sudo dpkg/apt-get; not available on smithy.
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout PR
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
      with:
        toolchain: 1.100.0
        targets: wasm32-wasip2

    - name: Install Hyperfine and Wasmtime
      run: |
        curl -fsSLo hyperfine.deb https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb
        sudo dpkg -i hyperfine.deb
        scripts/install-wasmtime.sh

    - name: Build PR component
      run: |
        cargo build --locked -p kapsel-fileops --target wasm32-wasip2 --release
        cp target/wasm32-wasip2/release/kapsel-fileops.wasm "$RUNNER_TEMP/pr.wasm"

    - name: Build or fetch baseline component
      # A base branch from before v0.3.0 has no crates/kapsel-fileops; its
      # component is then the released v0.2.2 asset, sha256-checked.
      env:
        BASE_REF: ${{ github.base_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        git fetch origin "$BASE_REF"
        git checkout "origin/$BASE_REF"
        if [ -f crates/kapsel-fileops/Cargo.toml ]; then
          cargo build --locked -p kapsel-fileops --target wasm32-wasip2 --release
          cp target/wasm32-wasip2/release/kapsel-fileops.wasm "$RUNNER_TEMP/base.wasm"
        else
          gh release download v0.2.2 --repo "$GITHUB_REPOSITORY" -p 'file_ops_component.wasm*' --dir "$RUNNER_TEMP/v0.2.2"
          (cd "$RUNNER_TEMP/v0.2.2" && sha256sum -c file_ops_component.wasm.sha256)
          cp "$RUNNER_TEMP/v0.2.2/file_ops_component.wasm" "$RUNNER_TEMP/base.wasm"
        fi
        git checkout "${{ github.sha }}"

    - name: Benchmark baseline and PR
      run: |
        D="$PWD"
        echo "Baseline test data" > baseline_test.txt
        mkdir -p baseline_results pr_results
        for which in base pr; do
          CMD="wasmtime run --dir $D::$D $RUNNER_TEMP/$which.wasm copy_file --src $D/baseline_test.txt --dest $D/${which}_copy.txt"
          bash -c "$CMD"
          if [ "$which" = base ]; then out=baseline_results/baseline_benchmark.json; else out=pr_results/pr_benchmark.json; fi
          hyperfine --export-json "$out" --warmup 3 "$CMD"
        done

    - name: Analyze Performance Regression
      run: |
        # Install jq for JSON analysis
        sudo apt-get update && sudo apt-get install -y jq

        BASELINE_TIME=$(jq -r '.results[0].mean' baseline_results/baseline_benchmark.json)
        PR_TIME=$(jq -r '.results[0].mean' pr_results/pr_benchmark.json)

        # Calculate percentage change; no usable baseline means no change to report
        if awk -v b="$BASELINE_TIME" -v p="$PR_TIME" 'BEGIN { exit !(b+0 > 0 && p+0 > 0) }'; then
          CHANGE=$(echo "scale=2; (($PR_TIME - $BASELINE_TIME) / $BASELINE_TIME) * 100" | bc)
        else
          echo "No usable baseline or PR mean (baseline=$BASELINE_TIME, pr=$PR_TIME); reporting 0% change"
          CHANGE=0
        fi

        echo "## 📈 Performance Regression Analysis" > regression_report.md
        echo "" >> regression_report.md
        echo "| Metric | Baseline | PR | Change |" >> regression_report.md
        echo "|--------|----------|----| -------|" >> regression_report.md
        echo "| Execution Time | ${BASELINE_TIME}s | ${PR_TIME}s | ${CHANGE}% |" >> regression_report.md
        echo "" >> regression_report.md

        # Check for significant regression (>5% slower)
        if (( $(echo "$CHANGE > 5" | bc -l) )); then
          echo "⚠️ **Performance Regression Detected**: ${CHANGE}% slower than baseline" >> regression_report.md
          echo "PERFORMANCE_REGRESSION=true" >> "$GITHUB_ENV"
        elif (( $(echo "$CHANGE < -5" | bc -l) )); then
          echo "✅ **Performance Improvement**: ${CHANGE}% faster than baseline" >> regression_report.md
        else
          echo "✅ **No Significant Change**: Performance within acceptable range" >> regression_report.md
        fi

    - name: Comment Regression Analysis
      if: github.actor != 'dependabot[bot]'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      with:
        script: |
          const fs = require('fs');

          if (fs.existsSync('regression_report.md')) {
            const report = fs.readFileSync('regression_report.md', 'utf8');

            const comment = await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

            // Set as actionable comment if regression detected
            if (process.env.PERFORMANCE_REGRESSION === 'true') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.data.id,
                content: 'eyes'
              });
            }
          }
