name: CI/CD Pipeline

# Required status checks for main: ruleset "main-required-checks" (id
# 28146575, owner approved the list 2026-11-26), mirrored one context per line
# in .github/required-contexts.txt. That file holds context names only, no
# comments: sieve v0.4.4 reads every non-empty line as a context. Each required
# job (here and in security.yml) runs on every pull request to main, with no
# paths filter and no job-level `if:`.
#
# v0.3.0: the JSON-config component is crates/kapsel-fileops (Rust), which
# replaced the TinyGo component under the same asset names (REQ-KS-041).
# "Component Build & Test (<os>)" replaced "TinyGo Component Build & Test
# (<os>)" in the required list.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  # scripts/install-wasmtime.sh pins the binary and its sha256.
  WASMTIME_VERSION: "50.0.3"

jobs:
  # Build the JSON-config component and prove it equivalent to the released
  # TinyGo v0.2.2 artifact.
  component:
    name: Component Build & Test
    # Stays on hosted: macOS matrix, and the oracle is fetched with gh.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
      with:
        toolchain: 1.100.0
        targets: wasm32-wasip2

    - name: Install wasmtime
      run: scripts/install-wasmtime.sh

    - name: Build WebAssembly component
      run: |
        cargo build --locked -p kapsel-fileops --target wasm32-wasip2 --release
        ls -l target/wasm32-wasip2/release/kapsel-fileops.wasm

    - name: Test kapsel-config and kapsel-fileops
      run: cargo test --locked -p kapsel-config -p kapsel-fileops --no-fail-fast

    - name: Equivalence with the TinyGo v0.2.2 artifact
      # The test downloads the v0.2.2 asset and its .sha256 with gh and
      # refuses to run unless both match the pinned sha256.
      env:
        GH_TOKEN: ${{ github.token }}
        KAPSEL_FILEOPS_ORACLE_DIR: ${{ runner.temp }}/oracle-v0.2.2
      run: cargo test --locked -p kapsel-fileops --test equivalence -- --ignored --nocapture

    - name: Upload component
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: kapsel-fileops-${{ matrix.os }}
        path: target/wasm32-wasip2/release/kapsel-fileops.wasm
        retention-days: 7
        if-no-files-found: error

  # The Rust workspace end to end, and the release path for the AOT asset.
  integration-test:
    name: Integration Testing
    # Stays on hosted: the oracle is fetched with gh, as in the component job.
    runs-on: ubuntu-24.04
    needs: [component]
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
      with:
        toolchain: 1.100.0
        targets: wasm32-wasip2

    - name: Keep kapsel's key and cache outside the workspace
      run: echo "KAPSEL_HOME=$RUNNER_TEMP/kapsel-home" >> "$GITHUB_ENV"

    - name: Install wasmtime
      run: scripts/install-wasmtime.sh

    - name: Build workspace
      run: cargo build --locked --workspace

    - name: Test workspace
      run: cargo test --locked --workspace --no-fail-fast

    - name: Build the AOT-embedded component as the release does
      run: |
        cargo build --locked -p kapsel-fileops --target wasm32-wasip2 --release
        scripts/build-aot.sh target/wasm32-wasip2/release/kapsel-fileops.wasm "$RUNNER_TEMP/file_ops_component_aot.wasm"

    - name: Embedding layout matches the v0.2.2 AOT asset
      env:
        GH_TOKEN: ${{ github.token }}
        ORACLE: ${{ runner.temp }}/oracle-v0.2.2
      run: |
        mkdir -p "$ORACLE"
        gh release download v0.2.2 --repo "$GITHUB_REPOSITORY" --clobber -p 'file_ops_component*' --dir "$ORACLE"
        (cd "$ORACLE" && sha256sum -c file_ops_component.wasm.sha256 file_ops_component_aot.wasm.sha256)
        KAPSEL_FILEOPS_ORACLE_DIR="$ORACLE" cargo test --locked -p kapsel-aot-embed --test embed -- --ignored

    - name: Equivalence of the AOT-embedded component
      env:
        GH_TOKEN: ${{ github.token }}
        KAPSEL_FILEOPS_ORACLE_DIR: ${{ runner.temp }}/oracle-v0.2.2
      run: |
        KAPSEL_FILEOPS_WASM="$RUNNER_TEMP/file_ops_component_aot.wasm" \
          cargo test --locked -p kapsel-fileops --test equivalence -- --ignored --nocapture

    - name: Precompiled code runs
      run: |
        T="$RUNNER_TEMP/aot-run"
        mkdir -p "$T/src"
        echo hello > "$T/src/a.txt"
        printf '%s' '{"workspace_dir":"/w/ws","operations":[{"type":"copy_file","src_path":"/w/src/a.txt","dest_path":"a.txt"}]}' > "$T/c.json"
        cargo run --locked --quiet -p kapsel-aot-embed -- extract "$RUNNER_TEMP/file_ops_component_aot.wasm" linux-x64 "$RUNNER_TEMP/linux-x64.cwasm"
        wasmtime run --allow-precompiled --dir "$T::/w" "$RUNNER_TEMP/linux-x64.cwasm" /w/c.json
        test "$(cat "$T/ws/a.txt")" = hello

  # Code quality checks
  quality-gate:
    name: Quality & Security Gate
    # Stays on hosted, as before; moving it to smithy is a separate change.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
      with:
        toolchain: 1.100.0
        targets: wasm32-wasip2
        components: clippy

    - name: Clippy (workspace)
      # Fails on clippy errors. Warnings do not fail yet: `-D warnings` fails
      # today in kapsel-check (3 findings), outside this change.
      run: cargo clippy --locked --workspace --all-targets

    - name: Clippy (component, wasm32-wasip2)
      run: cargo clippy --locked -p kapsel-fileops -p kapsel-config --target wasm32-wasip2 --release

    - name: Every crate takes the workspace license
      run: |
        status=0
        for m in crates/*/Cargo.toml; do
          if ! grep -qx 'license.workspace = true' "$m"; then
            echo "::error file=$m::missing 'license.workspace = true'"
            status=1
          fi
        done
        grep -qx 'license = "Apache-2.0"' Cargo.toml || { echo "::error file=Cargo.toml::workspace license is not Apache-2.0"; status=1; }
        test -f LICENSE || { echo "::error::LICENSE missing"; status=1; }
        exit $status

    - name: No Go or Python sources (REQ-KS-041, REQ-KS-064)
      run: |
        found=$(git ls-files '*.go' '*.py')
        if [ -n "$found" ]; then
          echo "::error::Go or Python sources in the tree:"
          echo "$found"
          exit 1
        fi
