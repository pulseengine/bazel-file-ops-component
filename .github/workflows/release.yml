name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Pre-rename path, dual-published through v0.3.x
  LEGACY_IMAGE_NAME: pulseengine/bazel-file-ops-component

jobs:
  build-and-release:
    name: Build & Release WASM Component
    # Stays on hosted: id-token signing and the gh-fetched oracle, as before.
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: never
      # scripts/install-wasmtime.sh pins the binary and its sha256;
      # scripts/build-aot.sh refuses any other version.
      WASMTIME_VERSION: "50.0.3"
    permissions:
      contents: write
      packages: write
      id-token: write  # For Cosign keyless signing

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (2026-10-16)
      with:
        toolchain: 1.100.0
        targets: wasm32-wasip2

    - name: Install wasmtime
      run: scripts/install-wasmtime.sh

    - name: Install Cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Build WASM Component
      run: |
        # The Rust JSON-config component (crates/kapsel-fileops), published
        # under the asset name the TinyGo component had (REQ-KS-041).
        cargo build --locked -p kapsel-fileops --target wasm32-wasip2 --release
        cp target/wasm32-wasip2/release/kapsel-fileops.wasm ./file_ops_component.wasm
        file ./file_ops_component.wasm
        ls -lh ./file_ops_component.wasm

    - name: Build AOT-Embedded WASM Component
      run: |
        # wasmtime compile (opt-level=2, no debug info) for linux-x64,
        # linux-arm64, darwin-x64, darwin-arm64, windows-x64 and portable
        # (pulley64), each embedded as custom section aot-<name> after the
        # header: the layout rules_wasm_component's wasm_embed_aot wrote up
        # to v0.2.2 (kapsel-aot-embed's ignored test rebuilds that asset).
        scripts/build-aot.sh file_ops_component.wasm file_ops_component_aot.wasm
        file ./file_ops_component_aot.wasm
        ls -lh ./file_ops_component_aot.wasm

        echo "Size comparison:"
        echo "  Regular WASM: $(ls -lh file_ops_component.wasm | awk '{print $5}')"
        echo "  AOT-embedded: $(ls -lh file_ops_component_aot.wasm | awk '{print $5}')"

    - name: Equivalence with the TinyGo v0.2.2 artifact (blocks the release)
      # Both assets run the whole corpus against the released v0.2.2
      # component; the test downloads it with gh and refuses to run unless
      # its sha256 matches the pinned value. A disagreement fails the job
      # before anything is pushed, signed or uploaded.
      env:
        GH_TOKEN: ${{ github.token }}
        KAPSEL_FILEOPS_ORACLE_DIR: ${{ runner.temp }}/oracle-v0.2.2
      run: |
        for asset in file_ops_component.wasm file_ops_component_aot.wasm; do
          echo "Equivalence: ${asset}"
          KAPSEL_FILEOPS_WASM="$PWD/${asset}" \
            cargo test --locked -p kapsel-fileops --test equivalence -- --ignored --nocapture
        done

    - name: Precompiled code runs (blocks the release)
      run: |
        T="$RUNNER_TEMP/aot-run"
        mkdir -p "$T/src"
        echo hello > "$T/src/a.txt"
        printf '%s' '{"workspace_dir":"/w/ws","operations":[{"type":"copy_file","src_path":"/w/src/a.txt","dest_path":"a.txt"}]}' > "$T/c.json"
        cargo run --locked --quiet -p kapsel-aot-embed -- extract file_ops_component_aot.wasm linux-x64 "$RUNNER_TEMP/linux-x64.cwasm"
        wasmtime run --allow-precompiled --dir "$T::/w" "$RUNNER_TEMP/linux-x64.cwasm" /w/c.json
        test "$(cat "$T/ws/a.txt")" = hello

    - name: Create SHA256 checksums
      run: |
        sha256sum file_ops_component.wasm > file_ops_component.wasm.sha256
        sha256sum file_ops_component_aot.wasm > file_ops_component_aot.wasm.sha256
        cat file_ops_component.wasm.sha256
        cat file_ops_component_aot.wasm.sha256

    - name: Generate compiler proof bundle (blocks the release)
      # ordeal solves every committed proof query of kapsel-compile and
      # re-checks each certificate; a stale or unproven query fails the job.
      env:
        KAPSEL_PROOF_OUT: ${{ runner.temp }}/proofs/kapsel-compile-proofs
      run: |
        cargo test --locked -p kapsel-compile --test proofs -- --nocapture
        tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
          -C "$RUNNER_TEMP/proofs" -cf - kapsel-compile-proofs \
          | gzip -n > kapsel-compile-proofs.tar.gz
        sha256sum kapsel-compile-proofs.tar.gz > kapsel-compile-proofs.tar.gz.sha256
        cat kapsel-compile-proofs.tar.gz.sha256

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create OCI Image with WASM Component
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_TAG: ${{ inputs.tag }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # Create an OCI artifact containing the WASM file
        # Using oras which is designed for OCI artifacts

        # Install oras
        VERSION="1.2.2"
        curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
        mkdir -p oras-install/
        tar -zxf "oras_${VERSION}_linux_amd64.tar.gz" -C oras-install/
        sudo mv oras-install/oras /usr/local/bin/
        rm -rf "oras_${VERSION}_linux_amd64.tar.gz" oras-install/

        # Determine tag
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          TAG="$INPUT_TAG"
        else
          TAG="$RELEASE_TAG"
        fi

        # Primary path follows the repository (ghcr.io/pulseengine/kapsel).
        # The pre-rename path is still published through v0.3.x so existing
        # consumers keep receiving releases; its manifests carry an annotation
        # that names the new path.
        IMAGE_TAG="${REGISTRY}/${IMAGE_NAME}:${TAG}"
        IMAGE_LATEST="${REGISTRY}/${IMAGE_NAME}:latest"
        IMAGE_AOT_TAG="${REGISTRY}/${IMAGE_NAME}:${TAG}-aot"
        IMAGE_AOT_LATEST="${REGISTRY}/${IMAGE_NAME}:latest-aot"
        MOVED="org.opencontainers.image.description=Moved to ${REGISTRY}/${IMAGE_NAME}; this path is published through v0.3.x only"
        MEDIA=application/vnd.wasm.component.layer.v1+wasm

        SIGN_REFS=""
        VERIFY_REFS=""
        for NAME in "${IMAGE_NAME}" "${LEGACY_IMAGE_NAME}"; do
          ANNOTATE=()
          if [ "${NAME}" = "${LEGACY_IMAGE_NAME}" ]; then
            ANNOTATE=(--annotation "${MOVED}")
          fi
          REF="${REGISTRY}/${NAME}"

          echo "Publishing regular WASM component to ${REF}:${TAG}"
          oras push "${REF}:${TAG}" "${ANNOTATE[@]}" \
            --artifact-type "${MEDIA}" \
            "file_ops_component.wasm:${MEDIA}"
          oras tag "${REF}:${TAG}" latest

          echo "Publishing AOT-embedded WASM component to ${REF}:${TAG}-aot"
          oras push "${REF}:${TAG}-aot" "${ANNOTATE[@]}" \
            --artifact-type "${MEDIA}" \
            "file_ops_component_aot.wasm:${MEDIA}"
          oras tag "${REF}:${TAG}-aot" latest-aot

          SIGN_REFS="${SIGN_REFS} ${REF}:${TAG} ${REF}:latest ${REF}:${TAG}-aot ${REF}:latest-aot"
          VERIFY_REFS="${VERIFY_REFS} ${REF}:${TAG} ${REF}:${TAG}-aot"
        done

        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
        echo "IMAGE_LATEST=${IMAGE_LATEST}" >> $GITHUB_ENV
        echo "IMAGE_AOT_TAG=${IMAGE_AOT_TAG}" >> $GITHUB_ENV
        echo "IMAGE_AOT_LATEST=${IMAGE_AOT_LATEST}" >> $GITHUB_ENV
        echo "SIGN_REFS=${SIGN_REFS# }" >> $GITHUB_ENV
        echo "VERIFY_REFS=${VERIFY_REFS# }" >> $GITHUB_ENV

    - name: Sign OCI Image with Cosign
      run: |
        # Keyless signing with GitHub OIDC, every published reference
        for REF in ${SIGN_REFS}; do
          echo "Signing ${REF}"
          cosign sign --yes "${REF}"
        done

    - name: Sign compiler proof bundle with Cosign
      run: |
        cosign sign-blob --yes \
          --bundle kapsel-compile-proofs.tar.gz.sigstore.json \
          kapsel-compile-proofs.tar.gz

    - name: Generate SLSA Provenance
      run: |
        # Create provenance attestation
        cat > provenance.json <<EOF
        {
          "buildType": "${{ github.server_url }}/${{ github.repository }}/release@v1",
          "builder": {
            "id": "https://github.com/actions/runner"
          },
          "invocation": {
            "configSource": {
              "uri": "${{ github.server_url }}/${{ github.repository }}",
              "digest": {
                "sha1": "${{ github.sha }}"
              }
            }
          },
          "metadata": {
            "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "completeness": {
              "parameters": true,
              "environment": false,
              "materials": false
            }
          },
          "materials": [
            {
              "uri": "${{ github.server_url }}/${{ github.repository }}",
              "digest": {
                "sha1": "${{ github.sha }}"
              }
            }
          ]
        }
        EOF

        # Attest the provenance for every versioned reference, both paths
        for REF in ${VERIFY_REFS}; do
          cosign attest --yes \
            --predicate provenance.json \
            --type slsaprovenance \
            "${REF}"
        done

    - name: Verify Signatures
      run: |
        # Fails the release if any versioned reference lacks a signature or
        # provenance from this repository's release workflow.
        IDENTITY="^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@"
        for REF in ${VERIFY_REFS}; do
          echo "Verifying ${REF}"
          cosign verify \
            --certificate-identity-regexp="${IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${REF}" > /dev/null
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp="${IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${REF}" > /dev/null
        done

    - name: Verify compiler proof bundle signature
      run: |
        # Fails the release unless the bundle was signed by this repository's
        # release workflow (same anchored identity as the OCI verification).
        IDENTITY="^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@"
        cosign verify-blob \
          --bundle kapsel-compile-proofs.tar.gz.sigstore.json \
          --certificate-identity-regexp="${IDENTITY}" \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
          kapsel-compile-proofs.tar.gz

    - name: Upload Release Assets
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: |
          file_ops_component.wasm
          file_ops_component.wasm.sha256
          file_ops_component_aot.wasm
          file_ops_component_aot.wasm.sha256
          kapsel-compile-proofs.tar.gz
          kapsel-compile-proofs.tar.gz.sha256
          kapsel-compile-proofs.tar.gz.sigstore.json
        tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    - name: Create Release Summary
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_TAG: ${{ inputs.tag }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # Determine tag
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          TAG="$INPUT_TAG"
        else
          TAG="$RELEASE_TAG"
        fi

        echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Published Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Regular WASM Component:**" >> $GITHUB_STEP_SUMMARY
        echo "- **File**: \`file_ops_component.wasm\` ($(ls -lh file_ops_component.wasm | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
        echo "- **OCI Artifact**: \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **OCI Artifact (latest)**: \`${IMAGE_LATEST}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**AOT-Embedded WASM Component:**" >> $GITHUB_STEP_SUMMARY
        echo "- **File**: \`file_ops_component_aot.wasm\` ($(ls -lh file_ops_component_aot.wasm | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
        echo "- **OCI Artifact**: \`${IMAGE_AOT_TAG}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **OCI Artifact (latest)**: \`${IMAGE_AOT_LATEST}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Platforms**: Linux x64/ARM64, macOS x64/ARM64, Windows x64, Pulley64 (compiled by wasmtime ${WASMTIME_VERSION}; loads only in that version)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔐 Security" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ All OCI artifacts signed with Cosign (keyless OIDC)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SLSA provenance attestation for all variants" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ SHA256 checksums provided for all files" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
        echo "- [Download WASM (Regular)](https://github.com/${{ github.repository }}/releases/tag/${TAG})" >> $GITHUB_STEP_SUMMARY
        echo "- [Download WASM (AOT)](https://github.com/${{ github.repository }}/releases/tag/${TAG})" >> $GITHUB_STEP_SUMMARY
        echo "- [Pull OCI (Regular)](${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG})" >> $GITHUB_STEP_SUMMARY
        echo "- [Pull OCI (AOT)](${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}-aot)" >> $GITHUB_STEP_SUMMARY
        echo "- Pre-rename path, published through v0.3.x: ${REGISTRY}/${LEGACY_IMAGE_NAME}" >> $GITHUB_STEP_SUMMARY
