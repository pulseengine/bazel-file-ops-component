version: 2
# Grouped monthly updates (fleet template, owner decision 2026-11-21; shape
# from pulseengine/rivet). One entry per ecosystem with its directories in one
# `directories:` list, so a release opens one PR, not one per directory. Every
# entry runs monthly (the 1st, 02:00 UTC), keeps at most 2 PRs open and waits
# 7 days after a release (cooldown). Lockstep groups would come first, because
# Dependabot puts a dependency in the FIRST group it matches; then one
# minor-patch group. Majors stay ungrouped, one PR each, so a breaking change is
# read on its own. Security updates ignore the schedule and the limit.
#
# No cargo entry: the repository has no Cargo.toml (the old entry pointed at
# /rust, which does not exist).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci-cd"
      - "automated"
    groups:
      github-actions-all:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directories:
      - /tinygo
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "go"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
      - "automated"
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

