[package]
name = "kapsel-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kapsel-plan.workspace = true
wasmtime = { version = "51", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
regex = "1"
# REQ-KS-063: decodes and encodes JSON strings for `json`, whose reader is
# kapsel's own lossless one (builtins/jsonedit.rs).
serde_json.workspace = true
# DD-KS-020: lossless YAML CST, pinned by the same rivet tag as kapsel-scan
# (DD-KS-014); `yaml set` and `yaml del` splice its node ranges.
rivet-yaml = { git = "https://github.com/pulseengine/rivet", tag = "v0.43.3" }
toml_edit = "0.25"
sha2.workspace = true

[dev-dependencies]
wat = "1"
wit-component = "0.263"
wit-parser = "0.263"
tempfile = "3"
kapsel-syntax.workspace = true
kapsel-check.workspace = true
kapsel-compile.workspace = true
