[package]
name = "kapsel-compile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kapsel-plan.workspace = true
# One wasm-tools release (0.263.0) for all of these, so their types agree.
wasm-encoder = "=0.263.0"
wit-component = "=0.263.0"
wit-parser = "=0.263.0"
wasmparser = "=0.263.0"

[dev-dependencies]
wasmtime = { version = "=50.0.3", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "anyhow"] }
serde_json.workspace = true
sha2.workspace = true
